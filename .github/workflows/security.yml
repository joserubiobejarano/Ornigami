name: Security checks

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agent-LocalLift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Agent-LocalLift/package-lock.json
      - run: npm ci
      - run: npm run security:audit
