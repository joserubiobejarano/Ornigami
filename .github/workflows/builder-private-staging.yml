name: Builder synthetic private staging rehearsal (temporary)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed application source SHA
        required: true
        default: 4e3e00af212a3d97de582ab6fca6ecca8d0665dd
        type: string
      origin:
        description: Approved HTTPS staging origin
        required: true
        default: https://builder-staging.ornigami.com
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: builder-private-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Synthetic private staging and actual-host acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      STAGING_ORIGIN: ${{ inputs.origin }}
      STAGING_HOST: builder-staging.ornigami.com
      RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: /tmp/builder-staging/evidence
      IMAGE: ornigami-builder:staging-${{ github.run_id }}-${{ github.run_attempt }}
      CADDY_IMAGE: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
      BUILDER_STORE_VOLUME: ornigami-builder-store-staging-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDER_RUNTIME_STORE_HOST_ID: ornigami-builder-store-v1
      STAGING_BASIC_AUTH_USER: staging-operator
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          clean: true

      - name: Verify exact source and approved-ref reachability
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          git fetch origin codex/ornigami-builder-private-staging-20261121
          git merge-base --is-ancestor "$SOURCE_SHA" origin/codex/ornigami-builder-private-staging-20261121
          mkdir -p "$RUNNER_TEMP/verify"
          {
            git rev-parse HEAD
            git ls-remote --heads origin refs/heads/codex/ornigami-builder-private-staging-20261121
            printf 'reachable=yes\n'
          } | tee "$RUNNER_TEMP/verify/source.txt"

      - name: Set up reviewed Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Prepare host user and evidence directories
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          if ! id -u 1000 >/dev/null 2>&1; then
            sudo useradd --uid 1000 --user-group --create-home --shell /bin/bash builder
          fi
          BUILDER_USER="$(id -nu 1000)"
          BUILDER_HOME="$(getent passwd "$BUILDER_USER" | cut -d: -f6)"
          sudo usermod -aG docker "$BUILDER_USER"
          sudo install -d -m 0755 -o "$BUILDER_USER" -g "$(id -gn "$BUILDER_USER")" \
            /tmp/builder-staging /tmp/builder-staging/xdg-config /tmp/builder-staging/xdg-cache "$EVIDENCE_ROOT"
          sudo chmod a+rx /home/runner /home/runner/work 2>/dev/null || true
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo -u "$BUILDER_USER" env HOME="$BUILDER_HOME" git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u "$BUILDER_USER" docker info >/dev/null
          sudo -u "$BUILDER_USER" docker compose version
          echo "BUILDER_USER=$BUILDER_USER" >> "$GITHUB_ENV"
          echo "BUILDER_HOME=$BUILDER_HOME" >> "$GITHUB_ENV"
          printf 'builder_user=%s\nbuilder_home=%s\n' "$BUILDER_USER" "$BUILDER_HOME" | tee "$RUNNER_TEMP/verify/builder-user.txt"

      - name: Re-establish exact clean source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard "$SOURCE_SHA"
          git clean -fd
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Enable Chromium user-namespace sandbox
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
            sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>&1 || true
          } | tee "$RUNNER_TEMP/verify/chromium-sandbox-sysctl.txt"
          sudo -u "$BUILDER_USER" unshare --user --map-root-user true

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          BT="$GITHUB_WORKSPACE/scripts/framework-prototype/browser-tools"
          sudo -u "$BUILDER_USER" env HOME="$BUILDER_HOME" npm ci --prefix "$BT" --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/verify/playwright-install.log"
          sudo env PATH="$PATH" node "$BT/node_modules/playwright/cli.js" install-deps chromium 2>&1 | tee "$RUNNER_TEMP/verify/playwright-deps.log"
          sudo -u "$BUILDER_USER" env HOME="$BUILDER_HOME" PLAYWRIGHT_BROWSERS_PATH="$BUILDER_HOME/.cache/ms-playwright" \
            node "$BT/node_modules/playwright/cli.js" install chromium 2>&1 | tee "$RUNNER_TEMP/verify/playwright-chromium-install.log"
          sudo -u "$BUILDER_USER" env HOME="$BUILDER_HOME" PLAYWRIGHT_BROWSERS_PATH="$BUILDER_HOME/.cache/ms-playwright" \
            XDG_CONFIG_HOME=/tmp/builder-staging/xdg-config XDG_CACHE_HOME=/tmp/builder-staging/xdg-cache \
            node --input-type=module -e '
              import { pathToFileURL } from "node:url";
              const mod = await import(pathToFileURL(process.argv[1]).href);
              const executable = mod.chromium.executablePath();
              console.log("chromium_executable=" + executable);
              const browser = await mod.chromium.launch({ headless: true, chromiumSandbox: true, executablePath: executable });
              await browser.close();
              console.log("playwright_launch=ok");
            ' "$BT/node_modules/playwright/index.mjs" 2>&1 | tee "$RUNNER_TEMP/verify/playwright-smoke.log"

      - name: Fetch reviewed staging package into the candidate tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin codex/ornigami-builder-private-staging-20261121 ci/builder-private-staging-20261121
          git worktree add --detach "$RUNNER_TEMP/staging-package" origin/codex/ornigami-builder-private-staging-20261121
          cp -a "$RUNNER_TEMP/staging-package/deploy/builder/private-staging" "$GITHUB_WORKSPACE/deploy/builder/private-staging"
          chmod +x "$RUNNER_TEMP"/staging-package/deploy/builder/private-staging/*.sh
          chmod +x "$GITHUB_WORKSPACE"/deploy/builder/private-staging/*.sh
          printf '%s\n' 'deploy/builder/private-staging/' >> "$GITHUB_WORKSPACE/.git/info/exclude"
          git show origin/ci/builder-private-staging-20261121:.github/scripts/private-staging-rehearsal.sh > "$RUNNER_TEMP/private-staging-rehearsal.sh"
          chmod +x "$RUNNER_TEMP/private-staging-rehearsal.sh"
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Run synthetic private staging acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_ROOT/logs"
          "$RUNNER_TEMP/private-staging-rehearsal.sh" 2>&1 | tee "$EVIDENCE_ROOT/logs/console.log"

      - name: Ensure access is closed
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_ROOT/logs"
          docker ps -aq --filter label=com.docker.compose.project=ornigami-builder-staging | xargs -r docker rm -f
          docker network ls -q --filter label=com.docker.compose.project=ornigami-builder-staging | xargs -r docker network rm
          if grep -q "[[:space:]]${STAGING_HOST}$" /etc/hosts 2>/dev/null; then
            sudo sed -i "\\|[[:space:]]${STAGING_HOST}$|d" /etc/hosts
          fi
          sudo rm -f /usr/local/share/ca-certificates/ornigami-builder-staging-ca.crt
          sudo update-ca-certificates >/dev/null 2>&1
          docker ps -a --no-trunc > "$EVIDENCE_ROOT/logs/docker-ps-close.txt" 2>&1
          docker volume ls > "$EVIDENCE_ROOT/logs/docker-volumes-close.txt" 2>&1
          printf 'access_closed=true\n' > "$EVIDENCE_ROOT/access-closed.txt"
          exit 0

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-private-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/builder-staging/evidence
          if-no-files-found: warn
          retention-days: 30
