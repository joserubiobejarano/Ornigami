name: cron-review-booster

on:
  # Vercel owns the hourly schedule. Keep dispatch for deliberate recovery only.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Review Booster cron
        run: |
          curl -fsS --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 60 \
            -X GET "$APP_BASE_URL/api/cron/review-booster" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
