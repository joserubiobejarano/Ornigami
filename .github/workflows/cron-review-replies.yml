name: cron-review-replies

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Review Replies cron
        run: |
          curl -fsS --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 60 \
            -X GET "$APP_BASE_URL/api/cron/review-replies" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
