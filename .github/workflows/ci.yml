name: Quality checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: https://ci.invalid/database
      OPENAI_API_KEY: ci-openai-key
      STRIPE_SECRET_KEY: ci-stripe-key
      STRIPE_WEBHOOK_SECRET: ci-stripe-webhook-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
      CRON_SECRET: ci-cron-secret
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: ci@example.com
      REPLY_TO_EMAIL: ci@example.com
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
      REVIEW_BOOSTER_UNSUBSCRIBE_SECRET: ci-unsubscribe-secret
      NEXT_PUBLIC_APP_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typegen
      - run: npx tsc --noEmit
      - name: Provide PostgreSQL 17 binaries for isolated SQL tests
        run: |
          a12_postgres17_bin=/usr/lib/postgresql/17/bin
          if [ ! -x "$a12_postgres17_bin/initdb" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-17
          fi
          "$a12_postgres17_bin/pg_config" --version
          echo "A04_PG_BIN=$a12_postgres17_bin" >> "$GITHUB_ENV"
          echo "$a12_postgres17_bin" >> "$GITHUB_PATH"
      - run: npm test
      - run: npm run build
      - run: npm run test:build
