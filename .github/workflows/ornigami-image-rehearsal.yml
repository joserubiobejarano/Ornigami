name: Ornigami image build and validation rehearsal

on:
  push:
    branches:
      - codex/ornigami-staging-readiness-20261018
    paths:
      - .github/build-requests/ornigami.json

permissions:
  statuses: read

concurrency:
  group: ornigami-external-image-build
  cancel-in-progress: false

jobs:
  build-validate-scan:
    name: Build, runtime acceptance, and vulnerability scans
    if: github.event.created == false && github.repository == 'joserubiobejarano/Ornigami' && github.event.repository.private == false && github.run_attempt == 1 && github.ref == 'refs/heads/codex/ornigami-staging-readiness-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Initialize evidence bundle
        id: evidence_initialize
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="$RUNNER_TEMP/ornigami-evidence"
          # GITHUB_STEP_SUMMARY is step-local. Export a stable pre-upload path.
          ORNIGAMI_JOB_SUMMARY="$RUNNER_TEMP/ornigami-job-summary.md"
          echo "ORNIGAMI_JOB_SUMMARY=$ORNIGAMI_JOB_SUMMARY" >> "$GITHUB_ENV"
          install -d -m 700 "$evidence_dir" "$evidence_dir/build" "$evidence_dir/scans" "$evidence_dir/runner" "$evidence_dir/runtime" "$evidence_dir/browser"
          printf '# Ornigami diagnostic evidence\n\nRun %s / attempt %s; request %s.\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$ORNIGAMI_JOB_SUMMARY"
          printf '%s\n' 'This artifact contains public rehearsal evidence only. It excludes the local image archive and credentials.' > "$evidence_dir/README.txt"
          printf 'run_id=%s\nrun_attempt=%s\nrequest_sha=%s\nref=%s\nevent=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" > "$evidence_dir/run-identity.txt"
          echo "ORNIGAMI_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          work_deadline=$(( $(date +%s) + 1440 ))
          echo "ORNIGAMI_WORK_DEADLINE_EPOCH=$work_deadline" >> "$GITHUB_ENV"
          tail_helper="$RUNNER_TEMP/ornigami-tail-deadline.sh"
          cat > "$tail_helper" <<'TAIL_HELPER'
          # Shared absolute tail deadlines. Offsets are always based on the existing work cutoff.
          ornigami_tail_validate() {
            local work=${ORNIGAMI_WORK_DEADLINE_EPOCH:-} work_epoch now
            [[ $work =~ ^[0-9]{1,12}$ ]] || { printf 'ORNIGAMI_WORK_DEADLINE_EPOCH must be a Unix epoch in seconds.\n' >&2; return 2; }
            command -v timeout >/dev/null || { printf 'GNU timeout is required for bounded workflow tail phases.\n' >&2; return 2; }
            work_epoch=$((10#$work))
            now=$(date +%s) || return 2
            (( now < work_epoch + 960 )) || { printf 'Workflow tail budget is exhausted.\n' >&2; return 124; }
          }
          ornigami_tail_init() {
            local work=${ORNIGAMI_WORK_DEADLINE_EPOCH:-} work_epoch
            ornigami_tail_validate || return $?
            work_epoch=$((10#$work))
            ORNIGAMI_TAIL_CAPTURE_DEADLINE_EPOCH=$((work_epoch + 180))
            ORNIGAMI_TAIL_UPLOAD_DEADLINE_EPOCH=$((work_epoch + 300))
            ORNIGAMI_TAIL_CUSTODY_DEADLINE_EPOCH=$((work_epoch + 600))
            ORNIGAMI_TAIL_CLEANUP_DEADLINE_EPOCH=$((work_epoch + 720))
            ORNIGAMI_TAIL_RESERVED_END_EPOCH=$((work_epoch + 960))
            ORNIGAMI_TAIL_EVENT_FILE=${ORNIGAMI_TAIL_EVENT_FILE:-${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ornigami-tail-events.state}
            : >> "$ORNIGAMI_TAIL_EVENT_FILE" || return 2
            chmod 600 -- "$ORNIGAMI_TAIL_EVENT_FILE" || return 2
            export ORNIGAMI_TAIL_CAPTURE_DEADLINE_EPOCH ORNIGAMI_TAIL_UPLOAD_DEADLINE_EPOCH
            export ORNIGAMI_TAIL_CUSTODY_DEADLINE_EPOCH ORNIGAMI_TAIL_CLEANUP_DEADLINE_EPOCH
            export ORNIGAMI_TAIL_RESERVED_END_EPOCH ORNIGAMI_TAIL_EVENT_FILE
          }
          ornigami_tail_resolve_phase() {
            local phase=$1 cap=$2 offset=$3 reserve=$4 now absolute local_deadline work_epoch cap_n offset_n reserve_n
            [[ $cap =~ ^[1-9][0-9]{0,3}$ && $offset =~ ^[1-9][0-9]{0,3}$ && $reserve =~ ^[1-9][0-9]{0,2}$ ]] || return 2
            ornigami_tail_validate || return $?
            cap_n=$((10#$cap)); offset_n=$((10#$offset)); reserve_n=$((10#$reserve))
            work_epoch=$((10#$ORNIGAMI_WORK_DEADLINE_EPOCH))
            now=$(date +%s) || return 2
            absolute=$((work_epoch + offset_n))
            local_deadline=$((now + cap_n))
            ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH=$local_deadline
            (( absolute >= local_deadline )) || ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH=$absolute
            (( ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH - now > reserve_n )) || {
              printf 'Workflow tail phase %s has no bounded work window remaining.\n' "$phase" >&2
              return 124
            }
            ORNIGAMI_TAIL_PHASE_WORK_SECONDS=$((ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH - now - reserve_n))
            ORNIGAMI_TAIL_PHASE_NAME=$phase
            export ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH ORNIGAMI_TAIL_PHASE_WORK_SECONDS ORNIGAMI_TAIL_PHASE_NAME
          }
          ornigami_tail_supervise() {
            local phase=$1 deadline=$2 reserve=$3 work_seconds kill_grace now status wrapper event_lines invocation events worker_exit
            shift 3
            now=$(date +%s) || return 125
            work_seconds=$((deadline - now - reserve))
            (( reserve >= 2 )) || { ORNIGAMI_TAIL_LAST_OUTCOME=invalid_reserve; return 2; }
            event_lines=$(wc -l < "$ORNIGAMI_TAIL_EVENT_FILE") || { ORNIGAMI_TAIL_LAST_OUTCOME=event_state_unavailable; return 125; }
            invocation="${BASHPID:-$$}.${RANDOM}.${now}"
            if (( work_seconds <= 0 )); then
              printf '%s|timeout|%s|before_start\n' "$phase" "$invocation" >> "$ORNIGAMI_TAIL_EVENT_FILE"
              ORNIGAMI_TAIL_LAST_OUTCOME=deadline_exhausted_before_start
              return 124
            fi
            kill_grace=$((reserve / 2))
            wrapper='set +e
          state=$1; phase=$2; grace=$3; shift 3
          invocation=$1; shift
          worker_pid=; kill_timer_pid=; timed_out=false
          on_term() {
            trap "" TERM
            timed_out=true
            printf "%s|timeout|%s\\n" "$phase" "$invocation" >> "$state"
            if [[ -n $worker_pid ]]; then
              kill -TERM -- "-$worker_pid" 2>/dev/null || kill -TERM "$worker_pid" 2>/dev/null || true
              (trap "" TERM; sleep "$((grace - 1))"; kill -KILL -- "-$worker_pid" 2>/dev/null || kill -KILL "$worker_pid" 2>/dev/null || true) &
              kill_timer_pid=$!
            fi
          }
          trap on_term TERM
          set -m
          "$@" &
          worker_pid=$!
          while :; do
            wait "$worker_pid"; status=$?
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
          done
          if [[ -n $kill_timer_pid ]]; then kill "$kill_timer_pid" 2>/dev/null || true; wait "$kill_timer_pid" 2>/dev/null || true; fi
          if [[ $timed_out != true ]]; then printf "%s|worker-exit|%s|%s\\n" "$phase" "$status" "$invocation" >> "$state"; fi
          exit "$status"'
            if timeout --signal=TERM --kill-after="${kill_grace}s" "${work_seconds}s" bash -c "$wrapper" tail-worker \
              "$ORNIGAMI_TAIL_EVENT_FILE" "$phase" "$kill_grace" "$invocation" "$@"; then
              ORNIGAMI_TAIL_LAST_OUTCOME=worker_success
              return 0
            else
              status=$?
            fi
            events=$(tail -n +"$((event_lines + 1))" "$ORNIGAMI_TAIL_EVENT_FILE" 2>/dev/null || true)
            if grep -Fq -- "$phase|timeout|$invocation" <<< "$events"; then
              ORNIGAMI_TAIL_LAST_OUTCOME=timed_out
              return 124
            fi
            worker_exit=$(awk -F'|' -v phase="$phase" -v invocation="$invocation" '$1 == phase && $2 == "worker-exit" && $4 == invocation { print $3 }' <<< "$events")
            if [[ -n $worker_exit ]]; then
              ORNIGAMI_TAIL_LAST_OUTCOME=worker_exit
              return "$status"
            fi
            if (( status == 124 || status == 137 )); then
              # GNU timeout can fire before the wrapper installs its TERM trap.
              # A missing marker is therefore timeout evidence only when the
              # wrapper also did not record a normal worker exit.
              printf '%s|timeout|%s|marker_missing\n' "$phase" "$invocation" >> "$ORNIGAMI_TAIL_EVENT_FILE"
              ORNIGAMI_TAIL_LAST_OUTCOME=timed_out_marker_missing
              return 124
            fi
            ORNIGAMI_TAIL_LAST_OUTCOME=worker_error
            return "$status"
          }
          TAIL_HELPER
          chmod 600 -- "$tail_helper"
          echo "ORNIGAMI_TAIL_HELPER=$tail_helper" >> "$GITHUB_ENV"
          ORNIGAMI_TAIL_HELPER=$tail_helper
          ORNIGAMI_WORK_DEADLINE_EPOCH=$work_deadline
          export ORNIGAMI_TAIL_HELPER ORNIGAMI_WORK_DEADLINE_EPOCH RUNNER_TEMP
          source "$tail_helper"
          ornigami_tail_init
          printf 'ORNIGAMI_TAIL_CAPTURE_DEADLINE_EPOCH=%s\nORNIGAMI_TAIL_UPLOAD_DEADLINE_EPOCH=%s\nORNIGAMI_TAIL_CUSTODY_DEADLINE_EPOCH=%s\nORNIGAMI_TAIL_CLEANUP_DEADLINE_EPOCH=%s\nORNIGAMI_TAIL_RESERVED_END_EPOCH=%s\nORNIGAMI_TAIL_EVENT_FILE=%s\n' \
            "$ORNIGAMI_TAIL_CAPTURE_DEADLINE_EPOCH" "$ORNIGAMI_TAIL_UPLOAD_DEADLINE_EPOCH" "$ORNIGAMI_TAIL_CUSTODY_DEADLINE_EPOCH" \
            "$ORNIGAMI_TAIL_CLEANUP_DEADLINE_EPOCH" "$ORNIGAMI_TAIL_RESERVED_END_EPOCH" "$ORNIGAMI_TAIL_EVENT_FILE" >> "$GITHUB_ENV"

      - name: Validate inputs and fetch exact public source
        id: validate_inputs
        shell: bash
        env:
          REQUEST_SHA: ${{ github.event.after }}
          RUN_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == refs/heads/codex/ornigami-staging-readiness-20261018 ]]
          [[ "$REQUEST_SHA" =~ ^[0-9a-f]{40}$ && "$REQUEST_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$RUN_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$RUN_WORKFLOW_REF" == 'joserubiobejarano/Ornigami/.github/workflows/ornigami-image-rehearsal.yml@refs/heads/codex/ornigami-staging-readiness-20261018' ]]
          repo_dir="$RUNNER_TEMP/request-repository"
          repo='https://github.com/joserubiobejarano/Ornigami.git'
          mkdir "$repo_dir"
          git -C "$repo_dir" init --quiet
          git -C "$repo_dir" remote add origin "$repo"
          git -C "$repo_dir" fetch --quiet --no-tags origin "$REQUEST_SHA"
          actual_request_sha=$(git -C "$repo_dir" rev-parse FETCH_HEAD)
          [[ "$actual_request_sha" == "$REQUEST_SHA" ]]
          git -C "$repo_dir" checkout --quiet --detach "$REQUEST_SHA"
          read -r commit_sha first_parent extra_parents < <(git -C "$repo_dir" rev-list --parents -n1 "$REQUEST_SHA")
          [[ "$commit_sha" == "$REQUEST_SHA" && -n "$first_parent" && -z "${extra_parents:-}" ]]
          mapfile -t changed_paths < <(git -C "$repo_dir" diff --name-only "$first_parent" "$REQUEST_SHA")
          [[ ${#changed_paths[@]} -eq 1 && "${changed_paths[0]}" == .github/build-requests/ornigami.json ]]
          git -C "$repo_dir" show "$REQUEST_SHA:.github/build-requests/ornigami.json" > "$RUNNER_TEMP/ornigami-build-request.json"
          jq -e 'type == "object" and (keys == ["packageLockSha256", "sourceSha"]) and (.sourceSha | type == "string" and test("^[0-9a-f]{40}$")) and (.packageLockSha256 | type == "string" and test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/ornigami-build-request.json" >/dev/null
          SOURCE_SHA=$(jq -r '.sourceSha' "$RUNNER_TEMP/ornigami-build-request.json")
          [[ "$SOURCE_SHA" == "$first_parent" ]]
          EXPECTED_LOCK_SHA256=$(jq -r '.packageLockSha256' "$RUNNER_TEMP/ornigami-build-request.json")
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_LOCK_SHA256=$EXPECTED_LOCK_SHA256" >> "$GITHUB_ENV"
          echo "REQUEST_SHA=$REQUEST_SHA" >> "$GITHUB_ENV"
          git -C "$repo_dir" merge-base --is-ancestor "$SOURCE_SHA" "$REQUEST_SHA"
          source_lock_sha=$(git -C "$repo_dir" show "$SOURCE_SHA:package-lock.json" | sha256sum | cut -d' ' -f1)
          if [[ "$source_lock_sha" != "$EXPECTED_LOCK_SHA256" ]]; then
            printf 'Build request package-lock SHA-256 mismatch: request=%s candidate_git_blob=%s. Refusing to build.\n' \
              "$EXPECTED_LOCK_SHA256" "$source_lock_sha" >&2
            exit 1
          fi
          candidate_workflow_blob=$(git -C "$repo_dir" rev-parse "$SOURCE_SHA:.github/workflows/ornigami-image-rehearsal.yml")
          request_workflow_blob=$(git -C "$repo_dir" rev-parse "$REQUEST_SHA:.github/workflows/ornigami-image-rehearsal.yml")
          [[ "$candidate_workflow_blob" == "$request_workflow_blob" ]]
          git -C "$repo_dir" worktree add --quiet --detach "$RUNNER_TEMP/source" "$SOURCE_SHA"
          actual_sha=$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)
          [[ "$actual_sha" == "$SOURCE_SHA" ]]
          [[ -z "$(git -C "$RUNNER_TEMP/source" status --porcelain --untracked-files=all)" ]]
          for required in Dockerfile package.json package-lock.json deploy/coolify/linux-runtime-acceptance.sh deploy/coolify/runtime-deadline.sh deploy/coolify/verify-runtime-config.mjs deploy/coolify/build-profile.json scripts/framework-prototype/build-profile.mjs; do
            [[ -f "$RUNNER_TEMP/source/$required" ]]
          done
          checkout_lock_sha=$(sha256sum "$RUNNER_TEMP/source/package-lock.json" | cut -d' ' -f1)
          [[ "$checkout_lock_sha" == "$source_lock_sha" ]]
          trial_scope=full
          if [[ -f "$RUNNER_TEMP/source/deploy/coolify/toolchain/recipe.json" ]]; then
            trial_scope=$(jq -er '.trialScope | select(. == "tooling" or . == "full")' "$RUNNER_TEMP/source/deploy/coolify/toolchain/recipe.json")
          fi
          echo "ORNIGAMI_TRIAL_SCOPE=$trial_scope" >> "$GITHUB_ENV"
          {
            printf '%s\n' '### Build request admission'
            printf '%s\n' "- Request commit: \`$REQUEST_SHA\`"
            printf '%s\n' "- Commit: \`$actual_sha\`"
            printf '%s\n' "- Committed package-lock.json SHA-256: \`$source_lock_sha\`"
            printf '%s\n' "- Detached checkout package-lock.json SHA-256: \`$checkout_lock_sha\`"
            printf '%s\n' '- Request marker: exact source and lock fields; only marker changed in single-parent request commit'
            printf '%s\n' '- Workflow blob: identical at candidate and request commits'
            printf '%s\n' '- Candidate is an ancestor of the request commit'
            printf '%s\n' '- Checkout: detached exact candidate; clean before build'
          } >> "$ORNIGAMI_JOB_SUMMARY"
          {
            printf 'request_sha=%s\nsource_sha=%s\nexpected_lock_sha256=%s\nsource_lock_sha256=%s\ncheckout_lock_sha256=%s\ncandidate_workflow_blob=%s\nrequest_workflow_blob=%s\n' \
              "$REQUEST_SHA" "$SOURCE_SHA" "$EXPECTED_LOCK_SHA256" "$source_lock_sha" "$checkout_lock_sha" "$candidate_workflow_blob" "$request_workflow_blob"
          } > "$ORNIGAMI_EVIDENCE_DIR/source-identity.txt"
          printf 'workflow_sha=%s\nworkflow_ref=%s\n' "$RUN_WORKFLOW_SHA" "$RUN_WORKFLOW_REF" >> "$ORNIGAMI_EVIDENCE_DIR/source-identity.txt"
          printf 'trial_scope=%s\n' "$trial_scope" >> "$ORNIGAMI_EVIDENCE_DIR/source-identity.txt"

      - name: Verify runner and Docker Buildx
        id: runner_preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          docker info >/dev/null
          docker info --format '{{.ID}}|{{.Driver}}|{{.CgroupDriver}}|{{.CgroupVersion}}|{{.DockerRootDir}}|{{json .SecurityOptions}}|{{.LiveRestoreEnabled}}' > "$RUNNER_TEMP/ornigami-daemon-before.txt"
          [[ -s "$RUNNER_TEMP/ornigami-daemon-before.txt" ]]
          docker buildx version
          docker buildx ls
          cpu_count=$(getconf _NPROCESSORS_ONLN)
          total_mib=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)
          available_mib=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)
          free_disk_bytes=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          {
            printf '%s\n' '### Runner preflight'
            printf '%s\n' "- Online CPUs: ${cpu_count} (minimum 4)"
            printf '%s\n' "- Total memory: ${total_mib} MiB (minimum 14336 MiB)"
            printf '%s\n' "- Available memory before build: ${available_mib} MiB (minimum 12288 MiB)"
            printf '%s\n' "- Free runner disk before build: ${free_disk_bytes} bytes (minimum 21474836480)"
          } >> "$ORNIGAMI_JOB_SUMMARY"
          [[ "$cpu_count" =~ ^[0-9]+$ && "$cpu_count" -ge 4 ]]
          [[ "$total_mib" =~ ^[0-9]+$ && "$total_mib" -ge 14336 ]]
          [[ "$available_mib" =~ ^[0-9]+$ && "$available_mib" -ge 12288 ]]
          [[ "$free_disk_bytes" =~ ^[0-9]+$ && "$free_disk_bytes" -ge 21474836480 ]]

      - name: Download and verify pinned Trivy scanner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location \
            --output trivy_0.76.0_Linux-64bit.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location \
            --output trivy_0.76.0_checksums.txt \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_checksums.txt
          grep -Fx 'e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  trivy_0.76.0_Linux-64bit.tar.gz' trivy_0.76.0_checksums.txt >/dev/null
          echo 'e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  trivy_0.76.0_Linux-64bit.tar.gz' | sha256sum --check --status
          tar -xzf trivy_0.76.0_Linux-64bit.tar.gz trivy
          chmod 0755 trivy
          ./trivy --version
          {
            printf '%s\n' '### Scanner verification'
            printf '%s\n' '- Trivy 0.76.0 Linux amd64 archive checksum verified against the official release checksum file:'
            printf '%s\n' '  https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_checksums.txt'
          } >> "$ORNIGAMI_JOB_SUMMARY"

      - name: Prepare pinned host Node and verify signed minimal parents
        id: parent_admission
        shell: bash
        run: |
          set -Eeuo pipefail
          node_archive="$RUNNER_TEMP/node-v22.23.3-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --output "$node_archive" https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          printf '%s  %s\n' df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de "$node_archive" | sha256sum --check
          tar -xJf "$node_archive" -C "$RUNNER_TEMP"
          node_dir="$RUNNER_TEMP/node-v22.23.3-linux-x64/bin"
          echo "$node_dir" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          printf '%s  %s\n' 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 "$RUNNER_TEMP/cosign" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/cosign"
          "$node_dir/node" "$RUNNER_TEMP/source/scripts/framework-prototype/verify-minimal-parents.mjs" "$RUNNER_TEMP/cosign" "$ORNIGAMI_EVIDENCE_DIR/parent-admission"
          "$node_dir/node" -e 'const fs=require("node:fs"),p=JSON.parse(fs.readFileSync(process.argv[1])),d=fs.readFileSync(process.argv[2],"utf8");for(const x of p.parents)if(!d.includes("@"+x.amd64Digest))throw Error("Dockerfile parent policy drift")' "$RUNNER_TEMP/source/scripts/framework-prototype/minimal-parent-policy.json" "$RUNNER_TEMP/source/Dockerfile"

      - name: Download bounded frozen database once
        id: database_download
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ORNIGAMI_EVIDENCE_DIR/stage-scans"
          database_repository=$("$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" --max-old-space-size=512 "$RUNNER_TEMP/source/scripts/framework-prototype/official-db-publication.mjs" "$SOURCE_SHA" "$ORNIGAMI_EVIDENCE_DIR/stage-scans/db-publication.json")
          [[ $(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}') -ge 21474836480 ]]
          caller=$(id -un)
          set +e
          sudo -n systemd-run --scope --quiet --expand-environment=no --unit="ornigami-db-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p MemoryMax=2147483648 -p MemorySwapMax=0 -p CPUQuota=100% \
            /usr/sbin/runuser -u "$caller" -- env NODE_OPTIONS=--max-old-space-size=512 GOMEMLIMIT=1536MiB \
            "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/bounded-scan-worker.mjs" "$ORNIGAMI_EVIDENCE_DIR/stage-scans/database-resources.json" "$RUNNER_TEMP/trivy" image --download-db-only --no-progress --db-repository "$database_repository" --cache-dir "$RUNNER_TEMP/trivy-cache" > "$ORNIGAMI_EVIDENCE_DIR/stage-scans/database-download.log" 2>&1
          download_rc=$?
          printf '%s\n' "$download_rc" > "$ORNIGAMI_EVIDENCE_DIR/stage-scans/database-download-exit.txt"
          exit "$download_rc"

      - name: Retain and validate shared frozen database before dependent work
        id: database_admission
        if: ${{ always() && steps.parent_admission.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          caller=$(id -un)
          sudo -n systemd-run --scope --quiet --expand-environment=no --unit="ornigami-db-admit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p MemoryMax=2147483648 -p MemorySwapMax=0 -p CPUQuota=100% \
            /usr/sbin/runuser -u "$caller" -- env NODE_OPTIONS=--max-old-space-size=512 SOURCE_SHA="$SOURCE_SHA" RUNNER_TEMP="$RUNNER_TEMP" ORNIGAMI_EVIDENCE_DIR="$ORNIGAMI_EVIDENCE_DIR" \
            "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/bounded-scan-worker.mjs" "$ORNIGAMI_EVIDENCE_DIR/stage-scans/database-admission-resources.json" "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" admit

      - name: Construct bounded experimental tooling after strict DB admission
        id: toolchain_build
        if: ${{ success() && steps.database_admission.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export NODE_OPTIONS=--max-old-space-size=512
          "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-build.mjs" build

      - name: Collect complete signed parent and constructed tool scans
        id: base_scan
        if: ${{ success() && steps.database_admission.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" parents
          python3 - "$RUNNER_TEMP/base-trivy.json" "$GITHUB_OUTPUT" "$ORNIGAMI_JOB_SUMMARY" <<'PY'
          import collections,json,pathlib,sys
          report=json.loads(pathlib.Path(sys.argv[1]).read_text())
          counts=collections.Counter(v['Severity'] for r in report.get('Results',[]) for v in r.get('Vulnerabilities',[]))
          with open(sys.argv[2],'a') as out: out.write(f"critical_count={counts['CRITICAL']}\nhigh_count={counts['HIGH']}\n")
          with open(sys.argv[3],'a') as out: out.write(f"\nOriginal minimal runtime base: CRITICAL={counts['CRITICAL']} HIGH={counts['HIGH']}; both parents and tooling scans retained; strict aggregate gate remains independent.\n")
          PY

      - name: Require both tooling security gates before BuildKit execution
        id: tooling_prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          export NODE_OPTIONS=--max-old-space-size=512
          node "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-runtime.mjs" gate
          node "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-runtime.mjs" args "$RUNNER_TEMP/ornigami-frontend-args.nul"

      - name: Require shared database lease before BuildKit probe or application compilation
        shell: bash
        run: |
          set -Eeuo pipefail
          caller=$(id -un)
          sudo -n systemd-run --scope --quiet --expand-environment=no --unit="ornigami-db-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p MemoryMax=2147483648 -p MemorySwapMax=0 -p CPUQuota=100% \
            /usr/sbin/runuser -u "$caller" -- env NODE_OPTIONS=--max-old-space-size=512 SOURCE_SHA="$SOURCE_SHA" RUNNER_TEMP="$RUNNER_TEMP" ORNIGAMI_EVIDENCE_DIR="$ORNIGAMI_EVIDENCE_DIR" \
            "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/bounded-scan-worker.mjs" "$ORNIGAMI_EVIDENCE_DIR/stage-scans/database-prebuild-check-resources.json" "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" check

      - name: Create bounded serial BuildKit builder
        id: buildkit
        shell: bash
        run: |
          set -Eeuo pipefail
          builder='ornigami-external-rehearsal'
          if docker buildx ls --format '{{.Name}}' | grep -Fxq "$builder"; then
            echo 'Refusing to reuse an existing builder.' >&2
            exit 1
          fi
          builder_state_volume="buildx_buildkit_${builder}0_state"
          if docker volume ls --format '{{.Name}}' | grep -Fxq "$builder_state_volume"; then
            echo 'Refusing to reuse an existing BuildKit state volume.' >&2
            exit 1
          fi
          printf '[worker.oci]\n  max-parallelism = 1\n' > "$RUNNER_TEMP/buildkitd.toml"
          tool_image=$(node "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-runtime.mjs" image)
          tool_image_id=$(node "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-runtime.mjs" image-id)
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt "image=$tool_image,memory=8g,memory-swap=8g,cpu-quota=300000,cpu-period=100000" \
            --buildkitd-config "$RUNNER_TEMP/buildkitd.toml" --use --bootstrap
          mapfile -t ids < <(docker ps --no-trunc --filter "name=^/buildx_buildkit_${builder}0$" --format '{{.ID}}')
          [[ ${#ids[@]} -eq 1 ]]
          container_name=$(docker inspect "${ids[0]}" --format '{{.Name}}')
          [[ "$container_name" == "/buildx_buildkit_${builder}0" ]]
          [[ "$(docker inspect "${ids[0]}" --format '{{.Image}}')" == "$tool_image_id" ]]
          printf 'builder_name=%s\nbuilder_container_id=%s\n' "$builder" "${ids[0]}" >> "$GITHUB_OUTPUT"
          state_volume=$(docker inspect "${ids[0]}" --format '{{range .Mounts}}{{if and (eq .Type "volume") (eq .Destination "/var/lib/buildkit")}}{{.Name}}{{end}}{{end}}')
          [[ "$state_volume" == "$builder_state_volume" && "$state_volume" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
          printf 'builder_state_volume=%s\n' "$state_volume" >> "$GITHUB_OUTPUT"
          docker inspect "${ids[0]}" --format 'memory={{.HostConfig.Memory}} memory_swap={{.HostConfig.MemorySwap}} cpu_quota={{.HostConfig.CpuQuota}} cpu_period={{.HostConfig.CpuPeriod}}'
          [[ "$(docker inspect "${ids[0]}" --format '{{.HostConfig.Memory}}')" == 8589934592 ]]
          [[ "$(docker inspect "${ids[0]}" --format '{{.HostConfig.MemorySwap}}')" == 8589934592 ]]
          [[ "$(docker inspect "${ids[0]}" --format '{{.HostConfig.CpuQuota}}')" == 300000 ]]
          [[ "$(docker inspect "${ids[0]}" --format '{{.HostConfig.CpuPeriod}}')" == 100000 ]]
          docker exec "${ids[0]}" sh -c 'printf "memory.max="; cat /sys/fs/cgroup/memory.max; printf "memory.swap.max="; cat /sys/fs/cgroup/memory.swap.max; printf "cpu.max="; cat /sys/fs/cgroup/cpu.max'
          [[ "$(docker exec "${ids[0]}" cat /sys/fs/cgroup/memory.max)" == 8589934592 ]]
          [[ "$(docker exec "${ids[0]}" cat /sys/fs/cgroup/memory.swap.max)" == 0 ]]
          [[ "$(docker exec "${ids[0]}" cat /sys/fs/cgroup/cpu.max)" == '300000 100000' ]]
          docker exec "${ids[0]}" sh -c '
            for path in memory.max memory.swap.max memory.peak memory.events cpu.max cpu.stat; do
              printf "==%s==\\n" "$path"
              cat "/sys/fs/cgroup/$path"
            done
          ' > "$RUNNER_TEMP/builder-before-build.txt"
          {
            printf '%s\n' '### BuildKit cgroup limits'
            printf '%s\n' '- memory.max: 8589934592 bytes; memory.swap.max: 0 bytes (Docker memory and memory-swap both capped at 8 GiB total)'
            printf '%s\n' '- cpu.max: 300000 100000; BuildKit OCI worker max-parallelism: 1'
            printf '%s\n' '- Initial memory event and CPU counters captured before build; no retry is configured'
          } >> "$ORNIGAMI_JOB_SUMMARY"

      - name: Probe constructed tooling without application compilation
        id: tooling_probe
        if: ${{ success() && env.ORNIGAMI_TRIAL_SCOPE == 'tooling' }}
        shell: bash
        env:
          BUILDKIT_CONTAINER_ID: ${{ steps.buildkit.outputs.builder_container_id }}
        run: |
          set -Eeuo pipefail
          export NODE_OPTIONS=--max-old-space-size=512
          node "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-probe.mjs"
          printf '\nTooling-only compatibility passed. Application phases intentionally unrequested; advisory coverage and overall security acceptance remain held.\n' >> "$ORNIGAMI_JOB_SUMMARY"

      - name: Build local Linux amd64 image
        id: image_build
        if: ${{ success() && env.ORNIGAMI_TRIAL_SCOPE == 'full' }}
        shell: bash
        env:
          BUILDKIT_CONTAINER_ID: ${{ steps.buildkit.outputs.builder_container_id }}
          BUILDKIT_CONTAINER_NAME: ${{ steps.buildkit.outputs.builder_name }}
        run: |
          set -Eeuo pipefail
          build_start_epoch=$(date +%s)
          build_start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "build_start_epoch=$build_start_epoch" >> "$GITHUB_OUTPUT"
          echo "build_start_utc=$build_start_utc" >> "$GITHUB_OUTPUT"
          build_rc=0
          stop_file="$RUNNER_TEMP/ornigami-full-build-observer.stop"
          node "$RUNNER_TEMP/source/scripts/framework-prototype/observe-buildkit.mjs" "$BUILDKIT_CONTAINER_ID" "$ORNIGAMI_EVIDENCE_DIR/runner/full-build-observations.jsonl" "$stop_file" > "$ORNIGAMI_EVIDENCE_DIR/runner/observer.log" 2>&1 &
          observer_pid=$!
          trap 'touch "$stop_file"; wait "$observer_pid" || true' EXIT
          build_timeout=$(( ORNIGAMI_WORK_DEADLINE_EPOCH - $(date +%s) ))
          [[ "$build_timeout" -gt 0 ]]
          approved_origin=$(node "$RUNNER_TEMP/source/scripts/framework-prototype/build-profile.mjs" origin)
          node "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-runtime.mjs" verify
          mapfile -d '' -t frontend_args < "$RUNNER_TEMP/ornigami-frontend-args.nul"
          [[ "${#frontend_args[@]}" -eq 2 ]]
          mkdir -p "$ORNIGAMI_EVIDENCE_DIR/build"
          set +e
          timeout --signal=TERM --kill-after=30s "$build_timeout"s docker buildx build \
            --builder ornigami-external-rehearsal \
            --platform linux/amd64 \
            "${frontend_args[@]}" \
            --load \
            --tag "ornigami:rehearsal-${SOURCE_SHA}" \
            --build-arg "NEXT_PUBLIC_APP_URL=${approved_origin}" \
            --build-arg ORNIGAMI_PRIVATE_STAGING_MODE=true \
            --build-arg ORNIGAMI_PRIVATE_STAGING_PLATFORM=coolify \
            --build-arg "ORNIGAMI_SOURCE_SHA=${SOURCE_SHA}" \
            --build-arg ORNIGAMI_BUILD_HEAP_MIB=4096 \
            --build-arg ORNIGAMI_BUILD_MEMORY_OPTIMIZATIONS=true \
            --build-arg ORNIGAMI_BUILD_DISABLE_SOURCEMAPS=false \
            --build-arg ORNIGAMI_BUILD_WEBPACK_WORKER=false \
            "$RUNNER_TEMP/source" 2>&1 | tee "$ORNIGAMI_EVIDENCE_DIR/build/stdout.log"
          pipeline_status=("${PIPESTATUS[@]}")
          build_rc=${pipeline_status[0]}
          tee_rc=${pipeline_status[1]}
          set -e
          printf 'docker_exit_code=%s\nlog_exit_code=%s\n' "$build_rc" "$tee_rc" > "$ORNIGAMI_EVIDENCE_DIR/build/exit-code.txt"
          if [[ "$build_rc" -eq 0 && "$tee_rc" -ne 0 ]]; then build_rc=$tee_rc; fi
          build_end_epoch=$(date +%s)
          build_end_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          build_seconds=$((build_end_epoch - build_start_epoch))
          echo "build_end_epoch=$build_end_epoch" >> "$GITHUB_OUTPUT"
          echo "build_end_utc=$build_end_utc" >> "$GITHUB_OUTPUT"
          echo "build_seconds=$build_seconds" >> "$GITHUB_OUTPUT"
          echo "build_exit_code=$build_rc" >> "$GITHUB_OUTPUT"
          builder_id=$(docker inspect "$BUILDKIT_CONTAINER_ID" --format '{{.Id}}' 2>/dev/null || true)
          builder_name=$(docker inspect "$BUILDKIT_CONTAINER_ID" --format '{{.Name}}' 2>/dev/null || true)
          if [[ "$builder_id" == "$BUILDKIT_CONTAINER_ID" && "$builder_name" == "/buildx_buildkit_${BUILDKIT_CONTAINER_NAME}0" ]]; then
            capture_rc=0
            docker exec "$builder_id" sh -c '
              for path in memory.max memory.swap.max memory.peak memory.events cpu.max cpu.stat; do
                printf "==%s==\\n" "$path"
                cat "/sys/fs/cgroup/$path"
              done
            ' > "$RUNNER_TEMP/builder-after-build.txt" || capture_rc=$?
            {
              printf '\n### Build result and cgroup counters\n\n'
              printf '%s\n' "- Build interval: ${build_start_utc} to ${build_end_utc} UTC (${build_seconds} seconds)"
              printf '%s\n' "- Build command exit code: ${build_rc}"
              if [[ "$capture_rc" -eq 0 ]]; then
                printf '%s\n' '- Observed builder counters immediately after build:'
                printf '%s\n' '```text'
                cat "$RUNNER_TEMP/builder-after-build.txt"
                printf '%s\n' '```'
              else
                printf '%s\n' '- Builder cgroup counters unavailable after build; resource acceptance will fail if an image was produced.'
              fi
            } >> "$ORNIGAMI_JOB_SUMMARY"
          else
            printf '\n### Build result\n\n- Build interval: %s to %s UTC (%s seconds)\n- Build command exit code: %s\n- Builder cgroup counters: unavailable; builder container not running\n' \
              "$build_start_utc" "$build_end_utc" "$build_seconds" "$build_rc" >> "$ORNIGAMI_JOB_SUMMARY"
          fi
          [[ "$build_rc" -eq 0 ]]
          image="ornigami:rehearsal-${SOURCE_SHA}"
          image_revision=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          image_platform=$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')
          image_id=$(docker image inspect "$image" --format '{{.Id}}')
          [[ "$image_revision" == "$SOURCE_SHA" && "$image_platform" == linux/amd64 ]]
          printf 'image_tag=%s\nimage_id=%s\n' "$image" "$image_id" >> "$GITHUB_OUTPUT"
          printf '\n### Local image identity\n\n- Image ID: `%s`\n- Platform: `%s`\n- Source revision label: `%s`\n- Image delivery: local runner only; no image publication\n' \
            "$image_id" "$image_platform" "$image_revision" >> "$ORNIGAMI_JOB_SUMMARY"
          {
            printf 'image_id=%s\nimage_platform=%s\nimage_revision=%s\n' "$image_id" "$image_platform" "$image_revision"
          } > "$ORNIGAMI_EVIDENCE_DIR/image-identity.txt"

      - name: Run disconnected Linux runtime acceptance
        id: runtime_acceptance
        if: ${{ success() && steps.image_build.outcome == 'success' && env.ORNIGAMI_TRIAL_SCOPE == 'full' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${ORNIGAMI_WORK_DEADLINE_EPOCH:-} =~ ^[0-9]{1,12}$ ]] || {
            echo 'Runtime acceptance requires a valid ORNIGAMI_WORK_DEADLINE_EPOCH.' >&2
            exit 1
          }
          runtime_budget_remaining=$(( ORNIGAMI_WORK_DEADLINE_EPOCH - $(date +%s) ))
          (( runtime_budget_remaining >= 150 )) || {
            echo 'Runtime acceptance work budget is exhausted or below its 150-second admission floor.' >&2
            exit 1
          }
          image="ornigami:rehearsal-${SOURCE_SHA}"
          runtime_rc=0
          bash "$RUNNER_TEMP/source/deploy/coolify/linux-runtime-acceptance.sh" "$image" > "$RUNNER_TEMP/runtime-acceptance.log" 2>&1 || runtime_rc=$?
          printf 'runtime_exit_code=%s\n' "$runtime_rc" >> "$GITHUB_OUTPUT"
          tee -a "$ORNIGAMI_JOB_SUMMARY" < "$RUNNER_TEMP/runtime-acceptance.log"
          report_path=$(sed -n 's/^report=//p' "$RUNNER_TEMP/runtime-acceptance.log" | tail -n1)
          if [[ -n "$report_path" && -f "$report_path" ]]; then
            report_dir=$(dirname "$report_path")
            report_real=$(realpath -e "$report_dir")
            runner_real=$(realpath -e "$RUNNER_TEMP")
            [[ "$report_real" == "$runner_real"/ornigami-runtime-acceptance-* ]]
            mkdir -p "$ORNIGAMI_EVIDENCE_DIR/runtime"
            for evidence_path in "$report_dir"/native-image-formats.json "$report_dir"/native-image-formats-error.txt "$report_dir"/report.txt "$report_dir"/runtime-http.json "$report_dir"/cleanup.json "$report_dir"/failure.json "$report_dir"/failure-evidence.txt "$report_dir"/container-logs.txt "$report_dir"/runtime-*-cgroup.txt "$report_dir"/runtime-disk.txt "$report_dir"/host-disk-before.txt "$report_dir"/host-disk-after.txt; do
              [[ -f "$evidence_path" ]] || continue
              cp -- "$evidence_path" "$ORNIGAMI_EVIDENCE_DIR/runtime/"
            done
            {
              printf '\n### Runtime acceptance receipt\n\n'
              printf '%s\n' '```text'
              cat "$report_path"
              for metric_file in "$report_dir"/runtime-*-cgroup.txt "$report_dir"/runtime-disk.txt "$report_dir"/host-disk-before.txt "$report_dir"/host-disk-after.txt; do
                [[ -f "$metric_file" ]] || continue
                printf '\n==%s==\n' "$(basename "$metric_file")"
                cat "$metric_file"
              done
              printf '%s\n' '```'
            } >> "$ORNIGAMI_JOB_SUMMARY"
          else
            printf '\nRuntime acceptance receipt path unavailable.\n' >> "$ORNIGAMI_JOB_SUMMARY"
          fi
          exit "$runtime_rc"

      - name: Run bounded Linux framework browser regressions
        id: framework_browser
        if: ${{ always() && steps.image_build.outcome == 'success' && steps.image_build.outputs.build_exit_code == '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$ORNIGAMI_EVIDENCE_DIR/framework-browser"
          mkdir -p "$evidence"
          node_archive="$RUNNER_TEMP/node-v22.23.3-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --output "$node_archive" \
            https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          printf '%s  %s\n' df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de "$node_archive" | sha256sum --check
          tar -xJf "$node_archive" -C "$RUNNER_TEMP"
          node_dir="$RUNNER_TEMP/node-v22.23.3-linux-x64"
          git -C "$RUNNER_TEMP/source" rev-parse HEAD > "$evidence/source-sha.txt"
          sha256sum "$RUNNER_TEMP/source/vendor/framework/next-16.4.2-ornigami-sri.2.tgz" > "$evidence/framework-package-sha256.txt"
          browser_timeout=$(( ORNIGAMI_WORK_DEADLINE_EPOCH - $(date +%s) ))
          [[ "$browser_timeout" -ge 60 ]]
          if [[ "$browser_timeout" -gt 900 ]]; then browser_timeout=900; fi
          command -v systemd-run >/dev/null
          command -v google-chrome >/dev/null || command -v chromium >/dev/null
          caller=$(id -un)
          set +e
          sudo -n systemd-run --scope --quiet --expand-environment=no \
            --unit="ornigami-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -p MemoryMax=8589934592 -p MemorySwapMax=0 -p CPUQuota=300% \
            /usr/sbin/runuser -u "$caller" -- \
            env GITHUB_ACTIONS=true GITHUB_REPOSITORY=joserubiobejarano/Ornigami \
            timeout --signal=TERM --kill-after=20s "$browser_timeout"s \
            bash "$RUNNER_TEMP/source/scripts/framework-prototype/linux-fixture-trial.sh" \
              "$RUNNER_TEMP/source" "$RUNNER_TEMP/ornigami-browser-work" "$node_dir" "$evidence" \
            2>&1 | tee "$evidence/trial.log"
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > "$evidence/scope-exit-code.txt"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Scan local image archive for OS and language vulnerabilities
        id: final_scan
        if: ${{ always() && steps.image_build.outcome == 'success' && steps.image_build.outputs.build_exit_code != '' && steps.image_build.outputs.build_exit_code == '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
          image="ornigami:rehearsal-${SOURCE_SHA}"
          image_id=$(docker image inspect "$image" --format '{{.Id}}')
          image_size=$(docker image inspect "$image" --format '{{.Size}}')
          rootfs_layers=$(docker image inspect "$image" --format '{{json .RootFS.Layers}}')
          rootfs_layers_sha256=$(printf '%s' "$rootfs_layers" | sha256sum | cut -d' ' -f1)
          docker save --output "$RUNNER_TEMP/ornigami-image.tar" "$image"
          archive_sha256=$(sha256sum "$RUNNER_TEMP/ornigami-image.tar" | cut -d' ' -f1)
          archive_bytes=$(stat -c %s "$RUNNER_TEMP/ornigami-image.tar")
          {
            printf '\n### Final image archive identity\n\n'
            printf '%s\n' "- Docker image ID: \`$image_id\`"
            printf '%s\n' "- Docker image bytes: $image_size"
            printf '%s\n' "- Root filesystem layer IDs: \`$rootfs_layers\`"
            printf '%s\n' "- Root filesystem layer-list SHA-256: \`$rootfs_layers_sha256\`"
            printf '%s\n' "- Saved archive SHA-256: \`$archive_sha256\`"
            printf '%s\n' "- Saved archive bytes: $archive_bytes"
            printf '%s\n' '- Trivy report ImageID must match the local Docker image ID above'
          } >> "$ORNIGAMI_JOB_SUMMARY"
          export INITIAL_BUILD_OUTCOME=success
          node "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" final
          python3 - "$RUNNER_TEMP/trivy.json" "$ORNIGAMI_JOB_SUMMARY" "$image_id" <<'PY'
          import collections, json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected_image_id = sys.argv[3]
          if not isinstance(report, dict) or type(report.get("SchemaVersion")) is not int or report["SchemaVersion"] != 2:
              raise SystemExit("Trivy report SchemaVersion is missing or unsupported; refusing to accept the scan")
          if report.get("ArtifactType") != "container_image":
              raise SystemExit("Trivy report ArtifactType is not container_image; refusing to accept the scan")
          metadata = report.get("Metadata")
          if not isinstance(metadata, dict) or metadata.get("ImageID") != expected_image_id:
              raise SystemExit("Trivy report Metadata.ImageID does not match the built image; refusing to accept the scan")
          results = report.get("Results")
          if not isinstance(results, list) or not results:
              raise SystemExit("Trivy returned missing or empty Results; refusing to accept the scan")
          counts = collections.Counter()
          findings = []
          seen_classes = set()
          expected_types = {"os-pkgs": {"debian"}, "lang-pkgs": {"npm", "node-pkg"}}
          seen_node_type = False
          for result in results:
              if not isinstance(result, dict) or not isinstance(result.get("Target"), str) or not result["Target"]:
                  raise SystemExit("Trivy returned a malformed result entry; refusing to accept the scan")
              result_class = result.get("Class")
              result_type = result.get("Type")
              if not isinstance(result_class, str) or not isinstance(result_type, str) or result_class not in expected_types or result_type not in expected_types[result_class]:
                  raise SystemExit("Trivy returned an unrecognized result class/type; refusing to accept the scan")
              seen_classes.add(result_class)
              if result_class == "lang-pkgs":
                  seen_node_type = True
              vulnerabilities = result.get("Vulnerabilities")
              if vulnerabilities is None:
                  continue
              if not isinstance(vulnerabilities, list):
                  raise SystemExit("Trivy returned malformed Vulnerabilities; expected absent, null, or a list")
              for item in vulnerabilities:
                  if not isinstance(item, dict) or any(not isinstance(item.get(key), str) or not item[key].strip() for key in ("Severity", "VulnerabilityID", "PkgName")):
                      raise SystemExit("Trivy returned a malformed vulnerability entry; refusing to accept the scan")
                  severity = item["Severity"].upper()
                  counts[severity] += 1
                  findings.append((severity, item["PkgName"], item.get("InstalledVersion", ""), item.get("FixedVersion", ""), item["VulnerabilityID"], item.get("PrimaryURL", "")))
          if seen_classes != set(expected_types) or not seen_node_type:
              raise SystemExit("Trivy report lacks OS or Node.js package inventory coverage; refusing to accept the scan")
          if any(level not in {"CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"} for level, *_ in findings):
              raise SystemExit("Trivy returned an unknown severity; refusing to accept the scan")
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("\n### Trivy 0.76.0 image scan\n\n")
              out.write("| Severity | Findings |\n| --- | ---: |\n")
              for level in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
                  out.write(f"| {level} | {counts[level]} |\n")
              out.write("\nNo image was pushed or published by this workflow.\n")
              if findings:
                  out.write("\n| Severity | Package | Installed | Fixed | Advisory | Primary URL |\n| --- | --- | --- | --- | --- | --- |\n")
                  safe = lambda value: str(value).replace("\\", "\\\\").replace("|", "\\|").replace("`", "\\`").replace("<", "&lt;").replace(">", "&gt;").replace("\n", " ")
                  for severity, package, installed, fixed, advisory, url in sorted(findings):
                      out.write(f"| {safe(severity)} | {safe(package)} | {safe(installed)} | {safe(fixed)} | {safe(advisory)} | {safe(url)} |\n")
          if counts["CRITICAL"] or counts["HIGH"]:
              raise SystemExit("Trivy found HIGH or CRITICAL vulnerabilities; scan recorded and build validation failed")
          PY

      - name: Collect serial bounded intermediate native and vulnerability evidence
        id: intermediate_scans
        if: ${{ always() && env.ORNIGAMI_TRIAL_SCOPE == 'full' && steps.buildkit.outcome == 'success' && steps.parent_admission.outcome == 'success' }}
        shell: bash
        env:
          INITIAL_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          OWNED_BUILDER_CONTAINER_ID: ${{ steps.buildkit.outputs.builder_container_id }}
        run: |
          set -Eeuo pipefail
          node "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" intermediates

      - name: Enforce complete all-stage security native and resource gates
        id: all_stage_gate
        if: ${{ always() && env.ORNIGAMI_TRIAL_SCOPE == 'full' && steps.parent_admission.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          node "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" aggregate

      - name: Reject build-time OOM or invalid cgroup counters
        id: build_resources
        env:
          EXPECTED_OBSERVED_BUILDER_ID: ${{ steps.buildkit.outputs.builder_container_id }}
        if: ${{ always() && env.ORNIGAMI_TRIAL_SCOPE == 'full' && steps.buildkit.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ORNIGAMI_EVIDENCE_DIR/runner"
          before="$RUNNER_TEMP/builder-before-build.txt"
          after="$RUNNER_TEMP/builder-after-build.txt"
          if [[ ! -s "$before" || ! -s "$after" ]]; then
            printf 'status=missing-before-or-after-counters\n' > "$ORNIGAMI_EVIDENCE_DIR/runner/resource-assessment.txt"
            printf 'assessment_exit_code=1\nlog_exit_code=0\n' > "$ORNIGAMI_EVIDENCE_DIR/runner/resource-exit-code.txt"
            exit 1
          fi
          set +e
          python3 - "$before" "$after" "$ORNIGAMI_JOB_SUMMARY" <<'PY' 2>&1 | tee "$ORNIGAMI_EVIDENCE_DIR/runner/resource-assessment.txt"
          import pathlib, re, sys
          def values(path):
              text = pathlib.Path(path).read_text()
              found = {}
              current = None
              for line in text.splitlines():
                  match = re.fullmatch(r"==([a-z.]+)==", line)
                  if match:
                      current = match.group(1)
                      found[current] = []
                  elif current:
                      if not line.strip():
                          raise SystemExit(f"Empty cgroup counter line in {path}")
                      found[current].append(line.strip())
              required = {"memory.max", "memory.swap.max", "memory.peak", "memory.events", "cpu.max", "cpu.stat"}
              if set(found) != required:
                  raise SystemExit(f"Incomplete builder cgroup counters in {path}")
              if any(not lines for lines in found.values()):
                  raise SystemExit(f"Empty builder cgroup counter section in {path}")
              found = {key: "\n".join(lines) for key, lines in found.items()}
              return found
          before, after = values(sys.argv[1]), values(sys.argv[2])
          if before["memory.max"] != "8589934592" or after["memory.max"] != "8589934592":
              raise SystemExit("Builder memory.max did not remain at 8 GiB")
          if before["memory.swap.max"] != "0" or after["memory.swap.max"] != "0":
              raise SystemExit("Builder memory.swap.max did not remain at zero")
          if before["cpu.max"] != "300000 100000" or after["cpu.max"] != "300000 100000":
              raise SystemExit("Builder CPU quota did not remain at 3 CPUs")
          def key_values(text):
              result = {}
              for line in text.splitlines():
                  parts = line.split()
                  if len(parts) != 2 or parts[0] in result or not parts[1].isdecimal():
                      raise SystemExit("Malformed cgroup counter values")
                  result[parts[0]] = int(parts[1])
              return result
          old_events, new_events = key_values(before["memory.events"]), key_values(after["memory.events"])
          required_events = {"low", "high", "max", "oom", "oom_kill", "oom_group_kill"}
          if not required_events.issubset(old_events) or not required_events.issubset(new_events):
              raise SystemExit("Incomplete memory.events counters")
          deltas = {key: new_events[key] - old_events[key] for key in sorted(new_events)}
          if any(delta < 0 for delta in deltas.values()):
              raise SystemExit("Builder memory.events counters decreased or reset")
          old_cpu, new_cpu = key_values(before["cpu.stat"]), key_values(after["cpu.stat"])
          if set(old_cpu) != set(new_cpu) or not {"usage_usec", "user_usec", "system_usec"}.issubset(old_cpu):
              raise SystemExit("Incomplete or mismatched builder cpu.stat counters")
          cpu_deltas = {key: new_cpu[key] - old_cpu[key] for key in sorted(old_cpu)}
          if any(delta < 0 for delta in cpu_deltas.values()):
              raise SystemExit("Builder cpu.stat counters decreased or reset")
          peak = after["memory.peak"]
          if not peak.isdecimal() or int(peak) > 8589934592:
              raise SystemExit("Builder memory.peak is invalid or exceeded its 8 GiB cap")
          with open(sys.argv[3], "a", encoding="utf-8") as out:
              out.write("\n### Build resource acceptance\n\n")
              out.write(f"- Builder memory.peak: {peak} bytes\n")
              out.write(f"- Build-time memory.events deltas: `{deltas}`\n")
              out.write(f"- Build-time cpu.stat deltas: `{cpu_deltas}`\n")
          if deltas["oom"] or deltas["oom_kill"] or deltas["oom_group_kill"]:
              raise SystemExit("Builder recorded a build-time OOM event; resource acceptance failed")
          print(f"status=passed; peak_bytes={peak}; memory_events_delta={deltas}; cpu_stat_delta={cpu_deltas}")
          PY
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf 'assessment_exit_code=%s\nlog_exit_code=%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" > "$ORNIGAMI_EVIDENCE_DIR/runner/resource-exit-code.txt"
          observation_status=0
          node "$RUNNER_TEMP/source/scripts/framework-prototype/validate-build-observation.mjs" "$ORNIGAMI_EVIDENCE_DIR/runner/full-build-observations.jsonl" "$EXPECTED_OBSERVED_BUILDER_ID" > "$ORNIGAMI_EVIDENCE_DIR/runner/full-observation-gate.txt" 2>&1 || observation_status=$?
          printf 'observation_exit_code=%s\n' "$observation_status" >> "$ORNIGAMI_EVIDENCE_DIR/runner/resource-exit-code.txt"
          [[ "${pipeline_status[0]}" -eq 0 && "${pipeline_status[1]}" -eq 0 && "$observation_status" -eq 0 ]]

      - name: Enforce pinned base image advisory threshold
        id: base_advisory_gate
        if: ${{ always() && steps.base_scan.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          critical='${{ steps.base_scan.outputs.critical_count }}'
          high='${{ steps.base_scan.outputs.high_count }}'
          [[ "$critical" =~ ^[0-9]+$ && "$high" =~ ^[0-9]+$ ]]
          printf 'Base scan gate: CRITICAL=%s HIGH=%s (threshold: zero for both)\n' "$critical" "$high" | tee "$ORNIGAMI_EVIDENCE_DIR/base-advisory-gate.txt" >> "$ORNIGAMI_JOB_SUMMARY"
          [[ "$critical" == 0 && "$high" == 0 ]]

      - name: Capture evidence bundle before cleanup
        id: evidence_capture
        if: always()
        shell: bash
        timeout-minutes: 3
        env:
          ADMISSION_OUTCOME: ${{ steps.validate_inputs.outcome }}
          RUNNER_PREFLIGHT_OUTCOME: ${{ steps.runner_preflight.outcome }}
          BASE_SCAN_OUTCOME: ${{ steps.base_scan.outcome }}
          IMAGE_BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          IMAGE_BUILD_EXIT_CODE: ${{ steps.image_build.outputs.build_exit_code }}
          RUNTIME_OUTCOME: ${{ steps.runtime_acceptance.outcome }}
          RUNTIME_EXIT_CODE: ${{ steps.runtime_acceptance.outputs.runtime_exit_code }}
          FINAL_SCAN_OUTCOME: ${{ steps.final_scan.outcome }}
          RESOURCE_OUTCOME: ${{ steps.build_resources.outcome }}
          FRAMEWORK_BROWSER_OUTCOME: ${{ steps.framework_browser.outcome }}
          FRAMEWORK_BROWSER_EXIT_CODE: ${{ steps.framework_browser.outputs.exit_code }}
          BASE_GATE_OUTCOME: ${{ steps.base_advisory_gate.outcome }}
          ALL_STAGE_OUTCOME: ${{ steps.all_stage_gate.outcome }}
          DATABASE_ADMISSION_OUTCOME: ${{ steps.database_admission.outcome }}
          TOOLING_BUILD_OUTCOME: ${{ steps.toolchain_build.outcome }}
          TOOLING_PREREQUISITES_OUTCOME: ${{ steps.tooling_prerequisites.outcome }}
          TOOLING_PROBE_OUTCOME: ${{ steps.tooling_probe.outcome }}
          OWNED_BUILDER_NAME: ${{ steps.buildkit.outputs.builder_name }}
          OWNED_BUILDER_CONTAINER_ID: ${{ steps.buildkit.outputs.builder_container_id }}
          OWNED_BUILDER_STATE_VOLUME: ${{ steps.buildkit.outputs.builder_state_volume }}
          OWNED_IMAGE_TAG: ${{ steps.image_build.outputs.image_tag }}
          OWNED_IMAGE_ID: ${{ steps.image_build.outputs.image_id }}
        run: |
          set -Eeuo pipefail
          tail_helper=${ORNIGAMI_TAIL_HELPER:-"$RUNNER_TEMP/ornigami-tail-deadline.sh"}
          [[ -r "$tail_helper" ]] || { printf 'Tail deadline helper is unavailable; evidence capture cannot be bounded.\n' >&2; exit 2; }
          source "$tail_helper"
          if [[ ${ORNIGAMI_EVIDENCE_CAPTURE_SUPERVISED:-false} != true ]]; then
            capture_failure_reason=''
            if ornigami_tail_resolve_phase capture 180 180 20; then
              capture_deadline=$ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH
            else
              deadline_status=$?
              capture_deadline=''
              if (( deadline_status == 124 )); then capture_failure_reason=deadline_exhausted; else capture_failure_reason=invalid_budget; fi
            fi
            if [[ -n "$capture_deadline" ]]; then
              export ORNIGAMI_EVIDENCE_CAPTURE_SUPERVISED=true
              set +e
              ornigami_tail_supervise capture "$capture_deadline" 20 "$BASH" "$0"
              capture_status=$?
              set -e
              if [[ ${ORNIGAMI_TAIL_LAST_OUTCOME:-} == timed_out* || ${ORNIGAMI_TAIL_LAST_OUTCOME:-} == deadline_exhausted_before_start ]]; then
                capture_failure_reason=supervisor_timeout
              elif (( capture_status != 0 )); then
                capture_failure_reason=worker_error
              fi
            else
              capture_status=$deadline_status
            fi
            if [[ $capture_failure_reason == supervisor_timeout ]]; then
              set +e
              timeout --signal=TERM --kill-after=1s 5s bash -c '
                set -e
                evidence=$1
                mkdir -p "$evidence"
                if [[ -f "$evidence/manifest.json" ]]; then mv -- "$evidence/manifest.json" "$evidence/manifest.partial.json"; fi
                printf "status=failed\\nreason=%s\\ndeadline_epoch=%s\\n" "$2" "$3" > "$evidence/capture-supervision-status.txt"
                cat > "$evidence/manifest.json" <<EOF
          {"schema":1,"capture_completeness_status":"failed","capture_supervisor_status":"$2","partial_evidence":"retained_unverified","files":[]}
          EOF
              ' tail-failure-receipt "$ORNIGAMI_EVIDENCE_DIR" "$capture_failure_reason" "${capture_deadline:-unavailable}"
              receipt_status=$?
              set -e
              printf 'Evidence capture failed: %s (receipt_writer_exit=%s). Partial files, if present, are unverified.\n' "$capture_failure_reason" "$receipt_status" >&2
              printf 'Evidence capture status: failed (%s); partial files, if present, remain unverified.\n' "$capture_failure_reason" >> "$GITHUB_STEP_SUMMARY"
            elif [[ $capture_failure_reason == worker_error ]]; then
              printf 'Evidence capture worker failed (exit=%s). Any available manifest remains diagnostic and acceptance fails.\n' "$capture_status" >&2
            elif [[ -n "$capture_failure_reason" ]]; then
              printf 'Evidence capture stopped before worker start: %s. No complete-capture claim is made.\n' "$capture_failure_reason" >&2
            fi
            exit "$capture_status"
          fi
          ORNIGAMI_JOB_SUMMARY=${ORNIGAMI_JOB_SUMMARY:-"$RUNNER_TEMP/ornigami-job-summary.md"}
          ORNIGAMI_EVIDENCE_DIR=${ORNIGAMI_EVIDENCE_DIR:-"$RUNNER_TEMP/ornigami-evidence"}
          mkdir -p "$ORNIGAMI_EVIDENCE_DIR/scans" "$ORNIGAMI_EVIDENCE_DIR/runner" "$ORNIGAMI_EVIDENCE_DIR/runtime" "$ORNIGAMI_EVIDENCE_DIR/build" "$ORNIGAMI_EVIDENCE_DIR/browser"
          printf 'builder_name=%s\nbuilder_container_id=%s\nbuilder_state_volume=%s\nimage_tag=%s\nimage_id=%s\n' \
            "$OWNED_BUILDER_NAME" "$OWNED_BUILDER_CONTAINER_ID" "$OWNED_BUILDER_STATE_VOLUME" "$OWNED_IMAGE_TAG" "$OWNED_IMAGE_ID" \
            > "$ORNIGAMI_EVIDENCE_DIR/runner/owned-resources.txt"
          printf 'workflow_outcome=%s\nworkflow_exit_code=%s\n' "$IMAGE_BUILD_OUTCOME" "$IMAGE_BUILD_EXIT_CODE" > "$ORNIGAMI_EVIDENCE_DIR/build/workflow-status.txt"
          printf 'trial_scope=%s\ntooling_build=%s\ntooling_prerequisites=%s\ntooling_probe=%s\nsecurity_acceptance=false\ncoverage_hold=true\n' "${ORNIGAMI_TRIAL_SCOPE:-unavailable}" "$TOOLING_BUILD_OUTCOME" "$TOOLING_PREREQUISITES_OUTCOME" "$TOOLING_PROBE_OUTCOME" > "$ORNIGAMI_EVIDENCE_DIR/tooling-scope-status.txt"
          runtime_evidence_missing=0
          for file in base-trivy.json trivy.json; do
            [[ -f "$RUNNER_TEMP/$file" ]] && cp -- "$RUNNER_TEMP/$file" "$ORNIGAMI_EVIDENCE_DIR/scans/$file"
          done
          for file in builder-before-build.txt builder-after-build.txt builder-final.txt; do
            [[ -f "$RUNNER_TEMP/$file" ]] && cp -- "$RUNNER_TEMP/$file" "$ORNIGAMI_EVIDENCE_DIR/runner/$file"
          done
          if [[ -n "$OWNED_BUILDER_CONTAINER_ID" ]]; then
            current_builder_id=$(docker inspect "$OWNED_BUILDER_CONTAINER_ID" --format '{{.Id}}' 2>/dev/null || true)
            current_builder_name=$(docker inspect "$OWNED_BUILDER_CONTAINER_ID" --format '{{.Name}}' 2>/dev/null || true)
            if [[ "$current_builder_id" == "$OWNED_BUILDER_CONTAINER_ID" && "$current_builder_name" == "/buildx_buildkit_${OWNED_BUILDER_NAME}0" ]]; then
              if docker exec "$OWNED_BUILDER_CONTAINER_ID" sh -c 'for path in memory.max memory.swap.max memory.peak memory.events cpu.max cpu.stat; do printf "==%s==\\n" "$path"; cat "/sys/fs/cgroup/$path"; done' > "$ORNIGAMI_EVIDENCE_DIR/runner/builder-before-cleanup.txt" 2>&1; then
                printf '%s\n' 'status=collected' >> "$ORNIGAMI_EVIDENCE_DIR/runner/builder-before-cleanup-status.txt"
              else
                printf '%s\n' 'status=unavailable' > "$ORNIGAMI_EVIDENCE_DIR/runner/builder-before-cleanup-status.txt"
              fi
            else
              printf '%s\n' 'status=owned-builder-container-not-present' > "$ORNIGAMI_EVIDENCE_DIR/runner/builder-before-cleanup-status.txt"
            fi
          else
            printf '%s\n' 'status=builder-not-created-or-id-unavailable' > "$ORNIGAMI_EVIDENCE_DIR/runner/builder-before-cleanup-status.txt"
          fi
          [[ -f "$RUNNER_TEMP/runtime-acceptance.log" ]] && cp -- "$RUNNER_TEMP/runtime-acceptance.log" "$ORNIGAMI_EVIDENCE_DIR/runtime/runtime-acceptance.log"
          if [[ "$RUNTIME_OUTCOME" != skipped ]]; then
            if [[ ! -s "$ORNIGAMI_EVIDENCE_DIR/runtime/runtime-http.json" ]]; then
              printf 'status=missing\nruntime_step_outcome=%s\nexit_code=%s\n' "$RUNTIME_OUTCOME" "$RUNTIME_EXIT_CODE" > "$ORNIGAMI_EVIDENCE_DIR/runtime/runtime-evidence-status.txt"
              runtime_evidence_missing=1
            else
              printf 'status=collected\nruntime_step_outcome=%s\nexit_code=%s\n' "$RUNTIME_OUTCOME" "$RUNTIME_EXIT_CODE" > "$ORNIGAMI_EVIDENCE_DIR/runtime/runtime-evidence-status.txt"
            fi
          else
            printf 'status=not-run\nruntime_step_outcome=skipped\n' > "$ORNIGAMI_EVIDENCE_DIR/runtime/runtime-evidence-status.txt"
          fi
          # Require all independently measured phases after success. A failed/early
          # runtime keeps available snapshots and exact failure diagnostics; later
          # phases are explicitly unavailable, never fabricated or called passed.
          {
            printf 'runtime_step_outcome=%s\n' "$RUNTIME_OUTCOME"
            for phase_file in runtime-first-cgroup.txt runtime-after-restart-cgroup.txt runtime-after-recreate-cgroup.txt native-image-formats.json; do
              if [[ -s "$ORNIGAMI_EVIDENCE_DIR/runtime/$phase_file" ]]; then
                printf '%s=collected\n' "$phase_file"
              else
                printf '%s=unavailable\n' "$phase_file"
                if [[ "$RUNTIME_OUTCOME" == success ]]; then runtime_evidence_missing=1; fi
              fi
            done
            if [[ "$RUNTIME_OUTCOME" == failure ]]; then
              for failure_file in failure.json failure-evidence.txt; do
                if [[ ! -s "$ORNIGAMI_EVIDENCE_DIR/runtime/$failure_file" ]]; then
                  printf '%s=missing-required-failure-diagnostic\n' "$failure_file"
                  runtime_evidence_missing=1
                fi
              done
            fi
          } > "$ORNIGAMI_EVIDENCE_DIR/runtime/snapshot-status.txt"
          printf 'workflow_outcome=%s\nworkflow_exit_code=%s\n' "${FRAMEWORK_BROWSER_OUTCOME:-unknown}" "${FRAMEWORK_BROWSER_EXIT_CODE:-}" > "$ORNIGAMI_EVIDENCE_DIR/browser/workflow-status.txt"
          if [[ -x "$RUNNER_TEMP/trivy" ]]; then
            "$RUNNER_TEMP/trivy" --version > "$ORNIGAMI_EVIDENCE_DIR/scans/trivy-version.txt" 2>&1 || printf '%s\n' 'Trivy version metadata unavailable.' > "$ORNIGAMI_EVIDENCE_DIR/scans/trivy-version.txt"
          else
            printf '%s\n' 'Trivy was unavailable before artifact capture.' > "$ORNIGAMI_EVIDENCE_DIR/scans/trivy-version.txt"
          fi
          {
            printf '== runner disk before cleanup ==\n'
            if ! df -PB1 "$RUNNER_TEMP"; then printf '%s\n' 'disk usage unavailable'; fi
            printf '\n== Docker storage before cleanup ==\n'
            if ! timeout 15s docker system df; then printf '%s\n' 'Docker storage report unavailable or timed out'; fi
            printf '\n== selected runner-temp path sizes (image archive size only; archive content is excluded) ==\n'
            for path in "$RUNNER_TEMP/source" "$RUNNER_TEMP/ornigami-image.tar" "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/trivy.db" "$RUNNER_TEMP/java-db"; do
              [[ -e "$path" ]] || continue
              if ! timeout 15s du -sb "$path"; then printf 'size unavailable: %s\n' "$(basename "$path")"; fi
            done
          } > "$ORNIGAMI_EVIDENCE_DIR/runner/pre-cleanup-usage.txt" 2>&1
          summary_evidence_missing=0
          if [[ -s "$ORNIGAMI_JOB_SUMMARY" ]]; then
            cp -- "$ORNIGAMI_JOB_SUMMARY" "$ORNIGAMI_EVIDENCE_DIR/step-summary.md"
            printf 'status=collected\nsource=persistent-job-summary\n' > "$ORNIGAMI_EVIDENCE_DIR/summary-status.txt"
          else
            summary_evidence_missing=1
            printf '# Incomplete evidence capture\n\nPersistent pre-upload job summary was missing or empty. Runtime outcome: %s; build outcome: %s. Capture failed; this fallback is not recovered phase evidence.\n' "$RUNTIME_OUTCOME" "$IMAGE_BUILD_OUTCOME" > "$ORNIGAMI_EVIDENCE_DIR/step-summary.md"
            printf 'status=missing-or-empty\nfallback=diagnostic-only\n' > "$ORNIGAMI_EVIDENCE_DIR/summary-status.txt"
          fi
          [[ -s "$ORNIGAMI_EVIDENCE_DIR/step-summary.md" ]]
          cat "$ORNIGAMI_EVIDENCE_DIR/step-summary.md" >> "$GITHUB_STEP_SUMMARY"
          export CAPTURE_COMPLETENESS=passed
          if [[ "$runtime_evidence_missing" -eq 1 || "$summary_evidence_missing" -eq 1 ]]; then export CAPTURE_COMPLETENESS=failed; fi
          python3 - "$ORNIGAMI_EVIDENCE_DIR" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "${SOURCE_SHA:-}" "${EXPECTED_LOCK_SHA256:-}" "$ADMISSION_OUTCOME" "$RUNNER_PREFLIGHT_OUTCOME" "$BASE_SCAN_OUTCOME" "$IMAGE_BUILD_OUTCOME" "$IMAGE_BUILD_EXIT_CODE" "$RUNTIME_OUTCOME" "$RUNTIME_EXIT_CODE" "$FINAL_SCAN_OUTCOME" "$RESOURCE_OUTCOME" "$BASE_GATE_OUTCOME" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = ("run_id", "run_attempt", "request_sha", "ref", "event", "source_sha", "expected_lock_sha256", "admission_outcome", "runner_preflight_outcome", "base_scan_outcome", "image_build_outcome", "image_build_exit_code", "runtime_outcome", "runtime_exit_code", "final_scan_outcome", "resource_outcome", "base_gate_outcome")
          metadata = dict(zip(names, sys.argv[2:]))
          metadata["framework_browser_outcome"] = __import__("os").environ.get("FRAMEWORK_BROWSER_OUTCOME", "unknown")
          metadata["framework_browser_exit_code"] = __import__("os").environ.get("FRAMEWORK_BROWSER_EXIT_CODE", "")
          metadata["runtime_evidence_status"] = (root / "runtime/runtime-evidence-status.txt").read_text(encoding="utf-8").splitlines()[0].split("=", 1)[1]
          metadata["summary_evidence_status"] = (root / "summary-status.txt").read_text(encoding="utf-8").splitlines()[0].split("=", 1)[1]
          metadata["runtime_snapshot_status"] = (root / "runtime/snapshot-status.txt").read_text(encoding="utf-8").splitlines()
          metadata["capture_completeness_status"] = __import__("os").environ["CAPTURE_COMPLETENESS"]
          metadata["capture_deadline_epoch"] = __import__("os").environ.get("ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH", "unavailable")
          metadata["capture_supervision"] = "bounded process-group supervisor"
          metadata["custody_status"] = "not-assessed-by-capture"
          metadata["all_stage_gate_outcome"] = __import__("os").environ.get("ALL_STAGE_OUTCOME", "unknown")
          metadata["database_admission_outcome"] = __import__("os").environ.get("DATABASE_ADMISSION_OUTCOME", "unknown")
          metadata["trial_scope"] = __import__("os").environ.get("ORNIGAMI_TRIAL_SCOPE", "unavailable")
          metadata["tooling_build_outcome"] = __import__("os").environ.get("TOOLING_BUILD_OUTCOME", "unknown")
          metadata["tooling_prerequisites_outcome"] = __import__("os").environ.get("TOOLING_PREREQUISITES_OUTCOME", "unknown")
          metadata["tooling_probe_outcome"] = __import__("os").environ.get("TOOLING_PROBE_OUTCOME", "unknown")
          metadata["security_acceptance"] = False
          metadata["coverage_hold"] = True
          stages = root / "stage-scans/index.json"
          expected=["original-base","original-runtime-base","build-base","deps","builder","prod-deps","runner","buildkit","dockerfile-frontend"]
          stages.parent.mkdir(parents=True,exist_ok=True)
          stage_capture = "passed"
          try:
              if not stages.exists():
                  if metadata["all_stage_gate_outcome"] not in ("unknown", "skipped", ""):
                      raise ValueError("attempted scan pipeline has no index")
                  data={"schema":1,"sourceSha":metadata["source_sha"],"result":"failed","expectedStages":expected,"stages":[{"stage":s,"result":"skipped","reason":"pipeline unavailable before capture"} for s in expected]}
              else:
                  data=json.loads(stages.read_text())
                  if data.get("sourceSha") != metadata["source_sha"] or data.get("expectedStages") != expected or sorted(x["stage"] for x in data["stages"]) != sorted(expected) or data.get("result") not in ("passed", "failed"):
                      raise ValueError("scan index identity or nine-stage coverage mismatch")
                  for stage in data["stages"]:
                      if stage.get("collectionComplete"):
                          required=["filesystem/result.json","filesystem-resources.json","vulnerabilities-resources.json","scan/index.json","scan/"+stage["stage"]+"/trivy.json"]
                          if any(not (stages.parent/stage["stage"]/p).is_file() or (stages.parent/stage["stage"]/p).stat().st_size == 0 for p in required):
                              raise ValueError("claimed complete stage lacks required receipts: "+stage["stage"])
          except (ValueError, KeyError, TypeError, AttributeError, OSError) as error:
              stage_capture="failed"
              if stages.exists():
                  (stages.parent/"invalid-index-preserved.txt").write_bytes(stages.read_bytes())
              data={"schema":1,"sourceSha":metadata["source_sha"],"result":"failed","expectedStages":expected,"captureError":str(error),"stages":[{"stage":s,"result":"unverified","reason":"invalid or incomplete scan evidence"} for s in expected]}
              metadata["capture_completeness_status"]="failed"
          stages.write_text(json.dumps(data,indent=2)+"\n")
          (stages.parent/"completeness-status.txt").write_text(stage_capture+"\n")
          if metadata["database_admission_outcome"] in ("success", "failure"):
              try:
                  dbdir=stages.parent/"database-admission"
                  publication=json.loads((stages.parent/"db-publication.json").read_text())
                  expected_digest="sha256:10584ede500597f516f0d5f4ab750c125999dc0359995a4494ab6cb12e700730"
                  if publication["sourceSha"] != metadata["source_sha"] or publication["manifestDigest"] != expected_digest or publication["repository"] != "ghcr.io/aquasecurity/trivy-db@"+expected_digest:
                      raise ValueError("official DB publication source/digest mismatch")
                  download=json.loads((stages.parent/"database-resources.json").read_text())
                  args=download["arguments"]
                  if args.count("--db-repository") != 1 or args[args.index("--db-repository")+1] != publication["repository"] or args.count("--download-db-only") != 1:
                      raise ValueError("official DB download invocation mismatch")
                  for name in ("index.json","clock.json","validation-clock.json","metadata-identity.json","databaseIdentity.json","scannerIdentity.json"):
                      if not (dbdir/name).is_file() or not (dbdir/name).stat().st_size:
                          raise ValueError("missing shared DB admission receipt: "+name)
                  db=json.loads((dbdir/"index.json").read_text())
                  if db.get("phase") != "complete" or db["sourceSha"] != metadata["source_sha"] or db["result"] != ("passed" if metadata["database_admission_outcome"] == "success" else "failed"):
                      raise ValueError("shared DB admission source/result mismatch")
                  if db.get("metadataIdentity") and not (dbdir/"metadata.original.bin").is_file():
                      raise ValueError("original bounded metadata missing")
                  if db.get("metadataIdentity"):
                      original=(dbdir/"metadata.original.bin").read_bytes()
                      identity=db["metadataIdentity"]
                      digest=hashlib.sha256(original).hexdigest()
                      if len(original)>65536 or len(original)!=identity["retainedBytes"] or digest!=identity["retainedSha256"] or (not identity["truncated"] and (identity["sha256"]!=digest or identity["bytes"]!=len(original))):
                          raise ValueError("original metadata content/identity mismatch")
                  metadata["database_diagnostics_status"]="collected"
              except (OSError, ValueError, KeyError, TypeError, AttributeError, IndexError) as error:
                  metadata["database_diagnostics_status"]="failed: "+str(error)
                  metadata["capture_completeness_status"]="failed"
                  (stages.parent/"completeness-status.txt").write_text("failed\n")
          else:
              metadata["database_diagnostics_status"]="not-run"
          metadata["all_stage_evidence_status"] = data["result"]
          files = []
          for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "manifest.json"):
              files.append({"path": path.relative_to(root).as_posix(), "bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          (root / "manifest.json").write_text(json.dumps({"schema": 1, **metadata, "files": files}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          if [[ "$(cat "$ORNIGAMI_EVIDENCE_DIR/stage-scans/completeness-status.txt")" != passed ]]; then exit 1; fi
          if [[ "$runtime_evidence_missing" -eq 1 || "$summary_evidence_missing" -eq 1 ]]; then
            printf '%s\n' 'Required runtime receipts, successful phase snapshots or persistent summary were missing; evidence collection failed. Manifest retained; custody is independent.' >&2
            exit 1
          fi

      - name: Admit bounded evidence upload
        id: evidence_upload_admission
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ORNIGAMI_TAIL_HELPER"
          if ! ornigami_tail_resolve_phase upload 120 300 15; then
            printf 'admitted=false\ntimeout_minutes=1\n' >> "$GITHUB_OUTPUT"
            printf 'upload_admission=failed\nreason=insufficient_or_invalid_budget\n' > "$RUNNER_TEMP/ornigami-upload-admission.local.txt"
            chmod 600 "$RUNNER_TEMP/ornigami-upload-admission.local.txt"
            exit 1
          fi
          # Actions accepts positive whole minutes only. Require the one-minute
          # action timeout plus the 15-second termination/finalization reserve.
          if (( ORNIGAMI_TAIL_PHASE_WORK_SECONDS < 60 )); then
            printf 'admitted=false\ntimeout_minutes=1\n' >> "$GITHUB_OUTPUT"
            printf 'upload_admission=failed\nreason=less_than_one_safe_actions_minute\n' > "$RUNNER_TEMP/ornigami-upload-admission.local.txt"
            chmod 600 "$RUNNER_TEMP/ornigami-upload-admission.local.txt"
            printf '%s\n' 'Upload skipped: the remaining safe window cannot fit a one-minute Actions timeout and termination reserve.' >&2
            exit 1
          fi
          printf 'admitted=true\ntimeout_minutes=1\n' > "$GITHUB_OUTPUT"
          printf 'upload_admission=passed\nphase_deadline_epoch=%s\nwork_seconds=%s\n' \
            "$ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH" "$ORNIGAMI_TAIL_PHASE_WORK_SECONDS" \
            > "$RUNNER_TEMP/ornigami-upload-admission.local.txt"
          chmod 600 "$RUNNER_TEMP/ornigami-upload-admission.local.txt"

      - name: Upload rehearsal evidence
        id: evidence_upload
        if: ${{ always() && steps.evidence_upload_admission.outputs.admitted == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ornigami-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ornigami-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Report downloadable evidence
        id: evidence_report
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          EVIDENCE_URL: ${{ steps.evidence_upload.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
        run: |
          set -Eeuo pipefail
          source "$ORNIGAMI_TAIL_HELPER"
          outcome_dir="$RUNNER_TEMP/ornigami-tail-outcomes.local"
          install -d -m 700 "$outcome_dir"
          outcome_file="$outcome_dir/upload-report.txt"
          printf 'report_status=unavailable\n' > "$outcome_file"
          chmod 600 "$outcome_file"
          if ! ornigami_tail_resolve_phase upload-report 300 600 15; then
            printf 'report_status=failed\nreason=insufficient_or_invalid_budget\nupload_outcome=%s\n' \
              "${UPLOAD_OUTCOME:-unavailable}" > "$outcome_file"
            exit 1
          fi
          # One shared five-minute window begins with upload reporting. Custody
          # may use only its remainder, never a fresh five-minute allowance.
          shared_deadline=$ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH
          printf 'ORNIGAMI_TAIL_REPORT_CUSTODY_DEADLINE_EPOCH=%s\n' "$shared_deadline" >> "$GITHUB_ENV"
          report_now=$(date +%s)
          report_deadline=$((report_now + 45))
          if (( shared_deadline < report_deadline )); then report_deadline=$shared_deadline; fi
          if (( report_deadline - report_now <= 15 )); then
            custody_status=pending
            [[ "${UPLOAD_OUTCOME:-unavailable}" == success ]] || custody_status=unavailable
            printf 'report_status=failed\nreason=insufficient_local_report_window\nupload_outcome=%s\ncustody_status=%s\n' \
              "${UPLOAD_OUTCOME:-unavailable}" "$custody_status" > "$outcome_file"
            exit 1
          fi
          report_worker() {
            {
              printf '\n### Downloadable evidence bundle\n\n'
              printf '%s\n' "- Upload status: ${UPLOAD_OUTCOME:-unavailable}"
              if [[ -n "${EVIDENCE_URL:-}" ]]; then printf '%s\n' "- Artifact: ${EVIDENCE_URL}"; fi
              printf '%s\n' '- Retention requested: 30 days (subject to repository policy)'
              printf '%s\n' '- Scan JSON and sanitized runtime/resource receipts are retained when produced.'
              printf '%s\n' '- Diagnostic evidence only; this artifact does not establish application acceptance.'
              printf '%s\n' '- The image archive is excluded. This report and later custody outcome receipts are local runner receipts and are not part of the uploaded snapshot.'
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'report_status=passed\nupload_outcome=%s\nartifact_url_present=%s\n' \
              "${UPLOAD_OUTCOME:-unavailable}" "$([[ -n "${EVIDENCE_URL:-}" ]] && printf true || printf false)" \
              > "$outcome_file.tmp"
            if [[ "${UPLOAD_OUTCOME:-unavailable}" == success ]]; then
              printf 'custody_status=pending\n' >> "$outcome_file.tmp"
            else
              printf 'custody_status=unavailable\nreason=upload_not_successful\n' >> "$outcome_file.tmp"
            fi
            chmod 600 "$outcome_file.tmp"
            mv -f -- "$outcome_file.tmp" "$outcome_file"
          }
          export outcome_file
          export -f report_worker
          if ! ornigami_tail_supervise upload-report "$report_deadline" 15 bash -c report_worker; then
            reason=supervisor_timeout_or_worker_failure
            [[ ${ORNIGAMI_TAIL_LAST_OUTCOME:-} == timed_out* ]] || reason=worker_failure
            custody_status=pending
            [[ "${UPLOAD_OUTCOME:-unavailable}" == success ]] || custody_status=unavailable
            printf 'report_status=failed\nreason=%s\nupload_outcome=%s\ncustody_status=%s\n' \
              "$reason" "${UPLOAD_OUTCOME:-unavailable}" "$custody_status" > "$outcome_file"
            chmod 600 "$outcome_file"
            exit 1
          fi

      - name: Require verified owner local evidence custody before cleanup
        id: evidence_custody
        if: ${{ always() && steps.evidence_upload.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          source "$ORNIGAMI_TAIL_HELPER"
          outcome_dir="$RUNNER_TEMP/ornigami-tail-outcomes.local"
          install -d -m 700 "$outcome_dir"
          custody_receipt="$outcome_dir/custody-outcome.txt"
          printf 'custody_status=unproved\nreason=not_yet_verified\n' > "$custody_receipt"
          chmod 600 "$custody_receipt"
          if [[ ${ORNIGAMI_CUSTODY_SUPERVISED:-false} != true ]]; then
            if ! ornigami_tail_resolve_phase custody 300 600 40; then
              printf 'custody_status=unproved\nreason=insufficient_or_invalid_budget\n' > "$custody_receipt"
              exit 1
            fi
            shared_deadline=${ORNIGAMI_TAIL_REPORT_CUSTODY_DEADLINE_EPOCH:-}
            if [[ ! "$shared_deadline" =~ ^[0-9]{1,12}$ ]]; then
              printf 'custody_status=unproved\nreason=shared_report_custody_deadline_missing\n' > "$custody_receipt"
              exit 1
            fi
            shared_deadline=$((10#$shared_deadline))
            if (( shared_deadline < ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH )); then
              ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH=$shared_deadline
            fi
            now=$(date +%s)
            if (( ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH - now <= 40 )); then
              printf 'custody_status=unproved\nreason=shared_report_custody_budget_exhausted\n' > "$custody_receipt"
              exit 1
            fi
            export ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH
            event_lines=$(wc -l < "$ORNIGAMI_TAIL_EVENT_FILE")
            if ornigami_tail_supervise custody "$ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH" 40 env ORNIGAMI_CUSTODY_SUPERVISED=true "$BASH" "$0"; then
              exit 0
            else
              supervisor_status=$?
              if tail -n +"$((event_lines + 1))" "$ORNIGAMI_TAIL_EVENT_FILE" | grep -Fq 'custody|timeout|'; then
                printf 'custody_status=unproved\nreason=supervisor_timeout\n' > "$custody_receipt"
              elif grep -Fqx 'reason=not_yet_verified' "$custody_receipt"; then
                printf 'custody_status=unproved\nreason=worker_failure_%s\n' "$supervisor_status" > "$custody_receipt"
              fi
              chmod 600 "$custody_receipt"
              exit 1
            fi
          fi
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ || ! "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'custody_status=unproved\nreason=missing_or_invalid_upload_identity\n' > "$custody_receipt"
            chmod 600 "$custody_receipt"
            exit 1
          fi
          context="ornigami/evidence-local/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          description="artifact=${ARTIFACT_ID};sha256=${ARTIFACT_DIGEST}"
          phase_deadline=$ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH
          api_timed_out=false
          while :; do
            now=$(date +%s)
            remaining=$((phase_deadline - now - 40))
            (( remaining > 3 )) || break
            api_seconds=15
            (( api_seconds < remaining - 2 )) || api_seconds=$((remaining - 2))
            if statuses=$(timeout --signal=TERM --kill-after=2s "${api_seconds}s" gh api --hostname github.com "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100"); then
              if jq -e --arg context "$context" --arg description "$description" --arg owner "$GITHUB_REPOSITORY_OWNER" \
                'any(.[]; .context == $context and .description == $description and .state == "success" and .creator.login == $owner)' <<< "$statuses" >/dev/null; then
                printf 'custody_status=verified\nrun_id=%s\nrun_attempt=%s\nrequest_sha=%s\nartifact_id=%s\nartifact_digest=%s\nowner=%s\n' \
                  "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$GITHUB_REPOSITORY_OWNER" \
                  > "$custody_receipt.tmp"
                chmod 600 "$custody_receipt.tmp"
                mv -f -- "$custody_receipt.tmp" "$custody_receipt"
                printf '%s\n' 'Owner checksum-verified local custody acknowledged before cleanup; local receipt is not part of the already-uploaded snapshot.'
                exit 0
              fi
            else
              api_status=$?
              if (( api_status == 124 || api_status == 137 )); then api_timed_out=true; fi
            fi
            now=$(date +%s)
            remaining=$((phase_deadline - now - 40 - 2))
            (( remaining > 0 )) || break
            sleep_seconds=10
            (( sleep_seconds < remaining )) || sleep_seconds=$remaining
            sleep "$sleep_seconds"
          done
          reason=no_matching_owner_acknowledgment
          [[ "$api_timed_out" == false ]] || reason=api_timeout_or_no_matching_owner_acknowledgment
          printf 'custody_status=unproved\nreason=%s\nrun_id=%s\nrun_attempt=%s\nrequest_sha=%s\nartifact_id=%s\nartifact_digest=%s\n' \
            "$reason" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" \
            > "$custody_receipt"
          chmod 600 "$custody_receipt"
          printf '%s\n' 'Local-download gate failed: no exact successful owner receipt was observed before the bounded deadline. No acceptance claim.' >&2
          exit 1

      - name: Remove temporary builder and local image
        id: cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          OWNED_BUILDER_NAME: ${{ steps.buildkit.outputs.builder_name }}
          OWNED_BUILDER_CONTAINER_ID: ${{ steps.buildkit.outputs.builder_container_id }}
          OWNED_BUILDER_STATE_VOLUME: ${{ steps.buildkit.outputs.builder_state_volume }}
          OWNED_IMAGE_TAG: ${{ steps.image_build.outputs.image_tag }}
          OWNED_IMAGE_ID: ${{ steps.image_build.outputs.image_id }}
          CUSTODY_STEP_OUTCOME: ${{ steps.evidence_custody.outcome }}
        run: |
          set -Eeuo pipefail
          source "$ORNIGAMI_TAIL_HELPER"
          outcome_dir="$RUNNER_TEMP/ornigami-tail-outcomes.local"
          cleanup_receipt="$outcome_dir/workflow-cleanup.txt"
          cleanup_final="$outcome_dir/workflow-cleanup-final.txt"
          cleanup_unproved_file="$RUNNER_TEMP/ornigami-cleanup-docker-unproved.txt"
          cleanup_finalize_failure() {
            local reason="$1" status="$2" message="$3"
            timeout --signal=TERM --kill-after=2s 8s "$BASH" -c '
              set -e
              final=$1; reason=$2; status=$3; custody=$4; summary=$5; message=$6
              mkdir -p -- "${final%/*}"
              chmod 700 "${final%/*}"
              printf "cleanup_status=failed\\nreason=%s\\nsupervisor_exit=%s\\ncustody_step_outcome=%s\\nresource_absence=unproved_after_interruption\\ndaemon_state=unproved\\n" \
                "$reason" "$status" "$custody" > "$final.tmp"
              chmod 600 "$final.tmp"
              mv -f -- "$final.tmp" "$final"
              printf "%s\\n" "$message" >> "$summary"
            ' cleanup-finalizer "$cleanup_final" "$reason" "$status" "${CUSTODY_STEP_OUTCOME:-unavailable}" "$GITHUB_STEP_SUMMARY" "$message"
          }
          if [[ ${ORNIGAMI_CLEANUP_SUPERVISED:-false} != true ]]; then
            if ! ornigami_tail_resolve_phase cleanup 120 720 30; then
              cleanup_finalize_failure insufficient_or_invalid_budget 124 \
                'Workflow cleanup could not start inside its bounded deadline; resource absence remains unproved.' || true
              exit 1
            fi
            cleanup_deadline=$ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH
            export cleanup_deadline cleanup_receipt cleanup_final cleanup_unproved_file
            export ORNIGAMI_CLEANUP_DEADLINE_EPOCH="$cleanup_deadline"
            export ORNIGAMI_CLEANUP_UNPROVED_FILE="$cleanup_unproved_file"
            export ORNIGAMI_TAIL_PHASE_DEADLINE_EPOCH="$cleanup_deadline"
            if ! timeout --signal=TERM --kill-after=2s 5s "$BASH" -c '
              set -e
              outcome_dir=$1; receipt=$2; final=$3; unproved=$4; custody=$5
              mkdir -p -- "$outcome_dir"
              chmod 700 "$outcome_dir"
              rm -f -- "$receipt" "$receipt.tmp" "$final" "$final.tmp" "$unproved"
              printf "cleanup_status=unproved\\nreason=not_yet_finished\\ncustody_step_outcome=%s\\n" "$custody" > "$receipt.tmp"
              chmod 600 "$receipt.tmp"
              mv -f -- "$receipt.tmp" "$receipt"
              : > "$unproved"
              chmod 600 "$unproved"
            ' cleanup-bootstrap "$outcome_dir" "$cleanup_receipt" "$cleanup_final" "$cleanup_unproved_file" "${CUSTODY_STEP_OUTCOME:-unavailable}"; then
              cleanup_finalize_failure bootstrap_failed 124 'Workflow cleanup receipt setup failed; resource absence remains unproved.' || true
              exit 1
            fi
            export -f ornigami_tail_validate ornigami_tail_init ornigami_tail_resolve_phase ornigami_tail_supervise
            if ornigami_tail_supervise cleanup "$cleanup_deadline" 30 env ORNIGAMI_CLEANUP_SUPERVISED=true "$BASH" "$0"; then
              if grep -Fqx 'cleanup_status=passed' "$cleanup_final"; then exit 0; fi
              cleanup_finalize_failure missing_or_incomplete_final_receipt 0 'Workflow cleanup worker exited without a successful final receipt; absence remains unproved.' || true
              exit 1
            else
              supervisor_status=$?
              if [[ ${ORNIGAMI_TAIL_LAST_OUTCOME:-} == timed_out* || ${ORNIGAMI_TAIL_LAST_OUTCOME:-} == deadline_exhausted_before_start ]]; then
                reason=supervisor_timeout
              else
                reason=worker_failure
              fi
              if [[ ! -s "$cleanup_final" || "$reason" == supervisor_timeout ]]; then
                cleanup_finalize_failure "$reason" "$supervisor_status" \
                  "Workflow cleanup failed ($reason); interrupted or uncertain resource absence and daemon state remain unproved." || true
              fi
              exit 1
            fi
          fi
          set +e
          set -o pipefail
          cleanup_failed=0
          cleanup_docker_bin=$(type -P docker 2>/dev/null || true)
          if [[ -z "$cleanup_docker_bin" ]]; then printf 'docker_unproved=client_unavailable\n' >> "$cleanup_unproved_file"; fi
          cleanup_record() {
            printf 'cleanup_readback=%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            printf 'cleanup_readback=%s\n' "$1" >> "$cleanup_receipt"
          }
          docker() {
            local now remaining call_seconds status
            if [[ -s "$cleanup_unproved_file" ]]; then return 124; fi
            now=$(date +%s) || { printf 'docker_unproved=clock_unavailable\n' >> "$cleanup_unproved_file"; return 124; }
            remaining=$((cleanup_deadline - now - 30 - 2))
            if (( remaining < 1 )); then
              printf 'docker_unproved=insufficient_phase_budget\n' >> "$cleanup_unproved_file"
              return 124
            fi
            call_seconds=10
            (( call_seconds <= remaining )) || call_seconds=$remaining
            timeout --signal=TERM --kill-after=2s "${call_seconds}s" "$cleanup_docker_bin" "$@"
            status=$?
            if (( status == 124 || status == 137 )); then
              printf 'docker_unproved=client_timeout_or_interruption\n' >> "$cleanup_unproved_file"
              return 124
            fi
            return "$status"
          }
          verify_absent() {
            local kind="$1" identity="$2" inventory
            if [[ -s "$cleanup_unproved_file" ]]; then
              cleanup_record "$kind absence unproved after Docker timeout/interruption: $identity"
              return 1
            fi
            case "$kind" in
              container) inventory=$(docker ps --all --quiet --no-trunc) ;;
              volume) inventory=$(docker volume ls --format '{{.Name}}') ;;
              image) inventory=$(docker image ls --all --quiet --no-trunc) ;;
              *) return 1 ;;
            esac
            if [[ $? -ne 0 || -s "$cleanup_unproved_file" || -z "$identity" ]]; then
              cleanup_record "$kind inventory unavailable; absence unproven"
              return 1
            fi
            if grep -Fxq -- "$identity" <<< "$inventory"; then
              cleanup_record "$kind still present: $identity"
              return 1
            fi
            cleanup_record "$kind absence verified: $identity"
          }
          {
            printf '\n### Disk and Docker usage before cleanup\n\n'
            printf '%s\n' '```text'
            df -PB1 "$RUNNER_TEMP"
            docker system df
            for path in "$RUNNER_TEMP/source" "$RUNNER_TEMP/ornigami-image.tar" "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/trivy.db" "$RUNNER_TEMP/java-db"; do
              [[ -e "$path" ]] || continue
              du -sb "$path"
            done
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          builder_actual_id=''
          builder_actual_name=''
          if [[ -n "$OWNED_BUILDER_CONTAINER_ID" ]]; then
            builder_actual_id=$(docker inspect "$OWNED_BUILDER_CONTAINER_ID" --format '{{.Id}}' 2>/dev/null || true)
            builder_actual_name=$(docker inspect "$OWNED_BUILDER_CONTAINER_ID" --format '{{.Name}}' 2>/dev/null || true)
          fi
          if [[ -n "$OWNED_BUILDER_CONTAINER_ID" && "$builder_actual_id" == "$OWNED_BUILDER_CONTAINER_ID" && "$builder_actual_name" == "/buildx_buildkit_${OWNED_BUILDER_NAME}0" && "$(docker inspect "$OWNED_BUILDER_CONTAINER_ID" --format '{{.State.Running}}' 2>/dev/null)" == true ]]; then
            docker exec "$OWNED_BUILDER_CONTAINER_ID" sh -c '
              for path in memory.max memory.swap.max memory.peak memory.events cpu.max cpu.stat; do
                printf "==%s==\\n" "$path"
                cat "/sys/fs/cgroup/$path"
              done
            ' > "$RUNNER_TEMP/builder-final.txt"
            if [[ -s "$RUNNER_TEMP/builder-final.txt" ]]; then
              {
                printf '\n### Final builder cgroup counters before cleanup\n\n'
                printf '%s\n' '```text'
                cat "$RUNNER_TEMP/builder-final.txt"
                printf '%s\n' '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf '\n### Final builder cgroup counters\n\n- Unavailable: the exact BuildKit container created by this run was not present and running for capture.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$OWNED_BUILDER_CONTAINER_ID" && "$builder_actual_id" == "$OWNED_BUILDER_CONTAINER_ID" && "$builder_actual_name" == "/buildx_buildkit_${OWNED_BUILDER_NAME}0" ]]; then
            if ! docker rm -f "$OWNED_BUILDER_CONTAINER_ID" >/dev/null 2>&1; then
              cleanup_failed=1
              cleanup_record 'owned builder removal failed'
            fi
          elif [[ -n "$OWNED_BUILDER_CONTAINER_ID" && -n "$builder_actual_id" ]]; then
            cleanup_failed=1
            cleanup_record 'preserved builder identity drift'
          fi
          if [[ -n "$OWNED_BUILDER_CONTAINER_ID" ]]; then
            verify_absent container "$OWNED_BUILDER_CONTAINER_ID" || cleanup_failed=1
          fi
          if [[ -n "$OWNED_BUILDER_STATE_VOLUME" && "$builder_actual_id" == "$OWNED_BUILDER_CONTAINER_ID" && "$builder_actual_name" == "/buildx_buildkit_${OWNED_BUILDER_NAME}0" ]]; then
            state_volume=$(docker volume inspect "$OWNED_BUILDER_STATE_VOLUME" --format '{{.Name}}' 2>/dev/null || true)
            volume_users=$(docker ps -aq --filter "volume=$OWNED_BUILDER_STATE_VOLUME" --no-trunc 2>/dev/null)
            volume_users_exit=$?
            if [[ "$volume_users_exit" -eq 0 && "$state_volume" == "$OWNED_BUILDER_STATE_VOLUME" && -z "$volume_users" ]]; then
              if ! docker volume rm "$OWNED_BUILDER_STATE_VOLUME" >/dev/null 2>&1; then
                cleanup_failed=1
                cleanup_record 'owned state volume removal failed'
              fi
            else
              cleanup_failed=1
              printf 'Preserved BuildKit state volume %s because it was unavailable or still attached.\n' "$OWNED_BUILDER_STATE_VOLUME" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ -n "$OWNED_BUILDER_STATE_VOLUME" ]]; then
            verify_absent volume "$OWNED_BUILDER_STATE_VOLUME" || cleanup_failed=1
          fi
          if [[ -n "$OWNED_IMAGE_TAG" && -n "$OWNED_IMAGE_ID" ]]; then
            current_image_id=$(docker image inspect "$OWNED_IMAGE_TAG" --format '{{.Id}}' 2>/dev/null || true)
            if [[ "$current_image_id" == "$OWNED_IMAGE_ID" ]]; then
              if ! docker image rm "$OWNED_IMAGE_ID" >/dev/null 2>&1; then
                cleanup_failed=1
                cleanup_record 'owned final image removal failed'
              fi
            elif [[ -n "$current_image_id" ]]; then
              cleanup_failed=1
              cleanup_record 'preserved final image identity drift'
            fi
            verify_absent image "$OWNED_IMAGE_ID" || cleanup_failed=1
          fi
          rm -f -- "$RUNNER_TEMP/ornigami-image.tar" "$RUNNER_TEMP/node-base.tar" "$RUNNER_TEMP/trivy.json"
          {
            printf '\n### Disk after cleanup\n\n'
            printf '%s\n' '```text'
            df -PB1 "$RUNNER_TEMP"
            printf '%s\n' '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

          if [[ -f "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" && -x "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" ]]; then
            if ! "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/serial-scan-driver.mjs" cleanup | tee -a "$GITHUB_STEP_SUMMARY"; then
              cleanup_failed=1
            fi
          else
            cleanup_failed=1
            cleanup_record 'owned tooling image cleanup unavailable'
          fi
          if [[ -f "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-build.mjs" && -x "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" ]]; then
            if ! "$RUNNER_TEMP/node-v22.23.3-linux-x64/bin/node" "$RUNNER_TEMP/source/scripts/framework-prototype/toolchain-build.mjs" cleanup | tee -a "$GITHUB_STEP_SUMMARY"; then
              cleanup_failed=1
            fi
          else
            cleanup_failed=1
            cleanup_record 'experimental toolchain cleanup unavailable'
          fi
          if [[ -s "$RUNNER_TEMP/ornigami-daemon-before.txt" ]] && docker info --format '{{.ID}}|{{.Driver}}|{{.CgroupDriver}}|{{.CgroupVersion}}|{{.DockerRootDir}}|{{json .SecurityOptions}}|{{.LiveRestoreEnabled}}' > "$RUNNER_TEMP/ornigami-daemon-after.txt" && cmp -s "$RUNNER_TEMP/ornigami-daemon-before.txt" "$RUNNER_TEMP/ornigami-daemon-after.txt"; then
            cleanup_record 'daemon identity/configuration unchanged'
          else
            cleanup_failed=1
            cleanup_record 'daemon identity/configuration verification unavailable or drifted'
          fi
          if [[ -s "$cleanup_unproved_file" ]]; then
            cleanup_failed=1
            unproved_reason=$(<"$cleanup_unproved_file")
            cleanup_record "Docker cleanup unproved ($unproved_reason); later resource absence and daemon completion are not claimed."
          fi
          cleanup_record "result=$cleanup_failed (0 requires successful owned-resource absence and daemon read-back)"
          printf 'cleanup_status=%s\ncleanup_exit=%s\ncustody_step_outcome=%s\ndocker_unproved=%s\n' \
            "$([[ $cleanup_failed -eq 0 ]] && printf passed || printf failed)" "$cleanup_failed" "${CUSTODY_STEP_OUTCOME:-unavailable}" "${unproved_reason:-none}" > "$cleanup_final.tmp"
          chmod 600 "$cleanup_final.tmp"
          mv -f -- "$cleanup_final.tmp" "$cleanup_final"
          exit "$cleanup_failed"
