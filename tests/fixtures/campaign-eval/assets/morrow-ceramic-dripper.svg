<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d2d"/>
      <stop offset=".62" stop-color="#1d3148"/>
      <stop offset="1" stop-color="#26384a"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbbb9f"/>
      <stop offset=".2" stop-color="#ddcfb6"/>
      <stop offset="1" stop-color="#b7a487"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7a98f"/>
      <stop offset=".14" stop-color="#e1d5bf"/>
      <stop offset=".38" stop-color="#f4ead8"/>
      <stop offset=".6" stop-color="#e6d8c0"/>
      <stop offset=".82" stop-color="#c9b89c"/>
      <stop offset="1" stop-color="#a8967b"/>
    </linearGradient>
    <linearGradient id="ceramicVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8eb"/>
      <stop offset=".35" stop-color="#e9dbc4"/>
      <stop offset="1" stop-color="#c4b295"/>
    </linearGradient>
    <radialGradient id="bowl" cx="46%" cy="38%" r="72%">
      <stop offset="0" stop-color="#6f5747"/>
      <stop offset=".58" stop-color="#403026"/>
      <stop offset="1" stop-color="#211914"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16202a" stop-opacity=".5"/>
      <stop offset=".62" stop-color="#16202a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#16202a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce9ee" stop-opacity=".38"/>
      <stop offset="1" stop-color="#dce9ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="coneClip">
      <path d="M394 434c10 184 96 354 154 418h184c58-64 144-234 154-418Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1500" fill="url(#wall)"/>
  <rect width="1200" height="1500" fill="url(#window)"/>
  <path d="M0 1018h1200v482H0z" fill="url(#table)"/>
  <path d="M0 1018h1200" stroke="#efe4d0" stroke-opacity=".28" stroke-width="2"/>

  <ellipse cx="638" cy="1264" rx="390" ry="92" fill="url(#shadow)" filter="url(#blur30)"/>

  <g>
    <!-- carafe -->
    <path d="M452 872c0 0-22 34-22 72v242c0 54 38 90 94 90h214c56 0 94-36 94-90V944c0-38-22-72-22-72Z" fill="url(#ceramicVertical)"/>
    <path d="M452 872c34 16 342 16 376 0" fill="none" stroke="#8e7b61" stroke-opacity=".42" stroke-width="3"/>
    <path d="M428 912c-10 20-10 252 0 276" fill="none" stroke="#fffaf0" stroke-opacity=".6" stroke-width="12" stroke-linecap="round"/>
    <path d="M456 1132c54 38 310 38 364 0" fill="none" stroke="#aa987d" stroke-opacity=".36" stroke-width="4"/>
    <path d="M486 940c-8 82-8 180 0 264" fill="none" stroke="#fffaf0" stroke-opacity=".65" stroke-width="28" stroke-linecap="round" filter="url(#blur10)"/>
    <path d="M784 944c8 76 8 168 0 254" fill="none" stroke="#8e7b61" stroke-opacity=".32" stroke-width="22" stroke-linecap="round" filter="url(#blur10)"/>
    <path d="M448 890c34 16 342 16 376 0" fill="none" stroke="#8e7b61" stroke-opacity=".42" stroke-width="3"/>

    <!-- dripper body -->
    <path d="M394 434c10 184 96 354 154 418h184c58-64 144-234 154-418Z" fill="url(#ceramic)" stroke="#a08d72" stroke-opacity=".45" stroke-width="2"/>
    <g clip-path="url(#coneClip)">
      <path d="M450 470c24 150 92 286 140 344" fill="none" stroke="#fffaf0" stroke-opacity=".58" stroke-width="34" stroke-linecap="round" filter="url(#blur10)"/>
      <path d="M798 486c-14 140-64 256-106 314" fill="none" stroke="#8c785c" stroke-opacity=".3" stroke-width="30" stroke-linecap="round" filter="url(#blur10)"/>
      <path d="M564 760h152" stroke="#8c785c" stroke-opacity=".4" stroke-width="3"/>
      <text x="640" y="706" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="8" fill="#6e5b45" opacity=".72">MORROW</text>
    </g>
    <path d="M388 434c0-30 112-54 252-54s252 24 252 54-112 54-252 54-252-24-252-54Z" fill="url(#ceramicVertical)" stroke="#a08d72" stroke-opacity=".45" stroke-width="2"/>
    <ellipse cx="640" cy="434" rx="208" ry="40" fill="url(#bowl)"/>
    <ellipse cx="640" cy="434" rx="208" ry="40" fill="none" stroke="#fdf5e6" stroke-opacity=".45" stroke-width="4"/>
    <ellipse cx="640" cy="436" rx="176" ry="30" fill="none" stroke="#d8c6aa" stroke-opacity=".34" stroke-width="3"/>
    <path d="M480 438c20 88 79 168 122 202" fill="none" stroke="#f7ecd9" stroke-opacity=".28" stroke-width="5"/>
    <path d="M800 438c-20 88-79 168-122 202" fill="none" stroke="#7d6a50" stroke-opacity=".38" stroke-width="5"/>

    <!-- ribs inside the bowl -->
    <path d="M552 424c16 14 156 14 176 0" fill="none" stroke="#c9b79b" stroke-opacity=".4" stroke-width="4"/>
    <path d="M580 447c8 8 112 8 120 0" fill="none" stroke="#c9b79b" stroke-opacity=".3" stroke-width="4"/>
    <path d="M610 468c6 5 54 5 60 0" fill="none" stroke="#c9b79b" stroke-opacity=".24" stroke-width="4"/>
    <path d="M520 506c24 46 60 94 92 126" fill="none" stroke="#b9a688" stroke-opacity=".26" stroke-width="5"/>
    <path d="M580 526c18 34 44 68 66 92" fill="none" stroke="#b9a688" stroke-opacity=".22" stroke-width="5"/>
    <path d="M640 544c12 24 28 48 42 64" fill="none" stroke="#b9a688" stroke-opacity=".18" stroke-width="5"/>

    <path d="M520 862c72 24 168 24 240 0" fill="none" stroke="#8c785c" stroke-opacity=".45" stroke-width="4"/>
    <path d="M548 850c56 16 128 16 184 0" fill="none" stroke="#fdf5e6" stroke-opacity=".36" stroke-width="3"/>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
  <rect width="1200" height="1500" fill="none" stroke="#08121d" stroke-opacity=".14" stroke-width="2"/>
</svg>
