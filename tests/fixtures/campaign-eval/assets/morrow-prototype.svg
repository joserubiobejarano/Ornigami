<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Early Morrow dripper prototype on a workbench">
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cdb8"/>
      <stop offset=".62" stop-color="#c4b397"/>
      <stop offset="1" stop-color="#a38f72"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c3f"/>
      <stop offset="1" stop-color="#2b4058"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b8a70"/>
      <stop offset=".2" stop-color="#d9c9ad"/>
      <stop offset=".52" stop-color="#f0e4cf"/>
      <stop offset=".82" stop-color="#cbb99c"/>
      <stop offset="1" stop-color="#8f7d63"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2c2419" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2c2419" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#wall)"/>
  <rect y="760" width="1200" height="440" fill="url(#bench)"/>
  <path d="M0 760h1200" stroke="#f1e6d2" stroke-opacity=".3" stroke-width="3"/>

  <ellipse cx="620" cy="980" rx="330" ry="70" fill="url(#shadow)" filter="url(#soft)"/>

  <!-- notebook and rib-spacing sketch -->
  <g transform="rotate(-6 240 870)">
    <rect x="70" y="790" width="360" height="250" rx="10" fill="#efe6d5" stroke="#9c8b70" stroke-opacity=".5"/>
    <path d="M110 840h280M110 882h280M110 924h200" stroke="#8c7c64" stroke-opacity=".45" stroke-width="3"/>
    <g fill="none" stroke="#234a6b" stroke-width="4" stroke-linecap="round">
      <path d="M140 970c40-56 120-56 160 0"/>
      <path d="M160 1000c30-40 90-40 120 0"/>
      <path d="M182 1024c18-22 52-22 70 0"/>
    </g>
    <text x="110" y="820" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="4" fill="#4a3f30">RIB SPACING / REVISED</text>
  </g>

  <!-- early cone prototype -->
  <g>
    <path d="M520 520c16 190 96 330 160 382h120c64-52 144-192 160-382Z" fill="url(#clay)" stroke="#6f5f49" stroke-opacity=".5" stroke-width="3"/>
    <ellipse cx="740" cy="520" rx="220" ry="46" fill="#3a2b21"/>
    <ellipse cx="740" cy="520" rx="220" ry="46" fill="none" stroke="#f5ead8" stroke-opacity=".55" stroke-width="5"/>
    <ellipse cx="740" cy="526" rx="180" ry="32" fill="none" stroke="#d8c6aa" stroke-opacity=".4" stroke-width="3"/>
    <path d="M568 550c24 92 70 178 112 232" fill="none" stroke="#fff8ea" stroke-opacity=".45" stroke-width="24" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M900 556c-20 88-56 168-92 220" fill="none" stroke="#7c6950" stroke-opacity=".34" stroke-width="20" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M700 900h80l-12 54h-56Z" fill="#b6a486" stroke="#6f5f49" stroke-opacity=".4"/>
    <text x="740" y="742" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9" fill="#5f4c38" opacity=".8">MORROW</text>
    <text x="740" y="792" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="5" fill="#6f5b44" opacity=".72">PROTOTYPE 01</text>
  </g>

  <!-- calipers -->
  <g transform="rotate(18 1010 900)" fill="none" stroke="#3d4650" stroke-width="10" stroke-linecap="round">
    <path d="M930 820v190M1082 820v190M1010 830h120M1010 830H950"/>
    <path d="M956 1010h108" stroke-width="8"/>
  </g>

  <rect width="1200" height="1200" filter="url(#grain)" opacity=".06" style="mix-blend-mode:multiply"/>
  <rect width="1200" height="1200" fill="none" stroke="#0d1824" stroke-opacity=".2" stroke-width="2"/>
</svg>
